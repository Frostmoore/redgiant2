packages:
  - "packages/*"

# Native/optional build scripts we do not need (pulled in by dockerode's ssh support).
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false
  # embedded-postgres links its binaries itself at start (autoRehydrateSymlinks).
  "@embedded-postgres/linux-x64": false
  "@embedded-postgres/linux-arm64": false
  "@embedded-postgres/darwin-x64": false
  "@embedded-postgres/darwin-arm64": false
  "@embedded-postgres/windows-x64": false

minimumReleaseAgeExclude:
  - ws@8.22.1
  - preact@11.1.1
