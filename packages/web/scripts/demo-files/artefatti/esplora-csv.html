<!-- redgiant-artifact {"name":"Esplora CSV","version":2,"libs":["react","papaparse","chartjs"]} -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Esplora CSV</title>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
import { useMemo, useState, useEffect, useRef } from "react";
import { createRoot } from "react-dom/client";
import Papa from "papaparse";
import Chart from "chart.js/auto";

const SAMPLE = `mese,entrate,uscite
gen,3200,2900
feb,3100,2750
mar,3500,3100
apr,3300,2600
mag,3800,3000
giu,4100,3300`;

const fmt = (n) => Number(n).toLocaleString("it-IT", { maximumFractionDigits: 1 });
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function App() {
  const [text, setText] = useState(SAMPLE);
  const [file, setFile] = useState("esempio.csv");
  const [theme, setTheme] = useState(0);
  useEffect(() => {
    const again = () => setTheme((n) => n + 1);
    addEventListener("redgiant:theme", again);
    return () => removeEventListener("redgiant:theme", again);
  }, []);
  const rows = useMemo(
    () => Papa.parse(text.trim(), { header: true, dynamicTyping: true, skipEmptyLines: true }).data,
    [text],
  );
  const cols = rows.length ? Object.keys(rows[0]) : [];
  const nums = cols.filter((c) => typeof rows[0][c] === "number");
  const [col, setCol] = useState(nums[0] ?? "");
  const values = rows.map((r) => Number(r[col]) || 0);
  const total = values.reduce((s, x) => s + x, 0);
  const best = values.length ? values.indexOf(Math.max(...values)) : -1;
  const trend = values.length > 1 && values[0] ? ((values.at(-1) - values[0]) / values[0]) * 100 : 0;
  const canvas = useRef(null);
  useEffect(() => {
    if (!canvas.current || !col) return;
    const chart = new Chart(canvas.current, {
      type: "bar",
      data: {
        labels: rows.map((r) => r[cols[0]]),
        datasets: [{ label: col, data: values, backgroundColor: cssVar("--rg-accent"), borderRadius: 6, maxBarThickness: 40 }],
      },
      options: {
        animation: false,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: cssVar("--rg-dim") }, border: { color: cssVar("--rg-line") } },
          y: { grid: { color: cssVar("--rg-line") }, ticks: { color: cssVar("--rg-dim") }, border: { display: false } },
        },
      },
    });
    return () => chart.destroy();
  }, [rows, col, theme]);
  return (
    <div className="rg-stack">
      <div className="rg-row">
        <div>
          <h2>Esplora CSV</h2>
          <span className="rg-muted">{file} · {rows.length} righe · {cols.length} colonne</span>
        </div>
        <span className="rg-spacer" />
        <label className="rg-btn">
          Apri un CSV
          <input type="file" accept=".csv,text/csv" hidden onChange={async (e) => {
            const f = e.target.files?.[0];
            if (f) { setText(await f.text()); setFile(f.name); }
          }} />
        </label>
      </div>
      <div className="rg-tabs">
        {nums.map((c) => (
          <button key={c} aria-selected={c === col ? "true" : "false"} onClick={() => setCol(c)}>{c}</button>
        ))}
      </div>
      <div className="rg-stats">
        <div className="rg-stat"><span className="rg-label">Totale {col}</span><strong>{fmt(total)}</strong></div>
        <div className="rg-stat"><span className="rg-label">Media per riga</span><strong>{fmt(total / (values.length || 1))}</strong></div>
        <div className="rg-stat">
          <span className="rg-label">Dalla prima all'ultima</span>
          <strong>{trend >= 0 ? "+" : ""}{fmt(trend)}<small>%</small></strong>
          <span className={`rg-delta ${trend >= 0 ? "up" : "down"}`}>picco: {best >= 0 ? rows[best][cols[0]] : "–"}</span>
        </div>
      </div>
      <div className="rg-card" style={{ height: 230 }}><canvas ref={canvas}></canvas></div>
      <div className="rg-scroll">
        <table>
          <thead><tr>{cols.map((c) => <th key={c}>{c}</th>)}</tr></thead>
          <tbody>{rows.map((r, i) => <tr key={i}>{cols.map((c) => <td key={c}>{typeof r[c] === "number" ? fmt(r[c]) : String(r[c])}</td>)}</tr>)}</tbody>
        </table>
      </div>
    </div>
  );
}
createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
