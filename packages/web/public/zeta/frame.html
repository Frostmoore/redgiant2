<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LibreOffice</title>
    <!-- RedGiant's isolated frame for LibreOffice in the browser (G37.4): served with its own
         isolation headers by the server (/zeta/), driven by the canvas through a BroadcastChannel. -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
      canvas { display: block; width: 100%; height: 100%; border: 0; outline: none; }
    </style>
  </head>
  <body>
    <canvas id="qtcanvas" contenteditable="true" oncontextmenu="event.preventDefault()" onkeydown="event.preventDefault()"></canvas>
    <script src="frame.js"></script>
  </body>
</html>
