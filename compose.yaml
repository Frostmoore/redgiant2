# RedGiant: `docker compose up -d` (the installer writes .env next to this file).
# Optional parts are profiles:  --profile engine (llama.cpp on CPU), --profile engine-cuda (NVIDIA),
#                               --profile search (SearXNG for web search).
name: redgiant

x-image: &image ${REDGIANT_IMAGE:-ghcr.io/frostmoore/redgiant2:latest}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: redgiant
      POSTGRES_DB: redgiant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run the installer or set POSTGRES_PASSWORD in .env}
    volumes:
      - redgiant-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redgiant -d redgiant"]
      interval: 5s
      timeout: 5s
      retries: 20

  redgiant:
    image: *image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://redgiant:${POSTGRES_PASSWORD}@postgres:5432/redgiant
      REDGIANT_TOKEN: ${REDGIANT_TOKEN:?run the installer or set REDGIANT_TOKEN in .env}
      # Inside the container; REDGIANT_PORT and REDGIANT_BIND in .env choose the published port.
      REDGIANT_PORT: "7600"
      REDGIANT_HOST: 0.0.0.0
      REDGIANT_SANDBOX: docker
      # The host's GPUs when the server cannot see them itself ("name:GB;…", written by the installer),
      # and how the engine reaches a GPU that is not NVIDIA's through Vulkan: dri (Linux only).
      REDGIANT_HOST_GPUS: ${REDGIANT_HOST_GPUS:-}
      REDGIANT_ENGINE_GPU: ${REDGIANT_ENGINE_GPU:-}
      # Windows only (G24.3b): the engine RedGiant.exe runs on Windows, reached at this address,
      # with its folder (models, KV caches, commands) mounted at /winengine.
      REDGIANT_WIN_HOST: ${REDGIANT_WIN_HOST:-}
      REDGIANT_WIN_ENGINE_DIR: /winengine
      REDGIANT_SANDBOX_IMAGE: ${REDGIANT_SANDBOX_IMAGE:-ghcr.io/frostmoore/redgiant2-sandbox:latest}
      REDGIANT_SANDBOX_NETWORK: redgiant-sandbox
      REDGIANT_EGRESS_URL: http://egress:3128
      # Sandboxes mount their workspaces from the same volume (no host paths).
      REDGIANT_DATA_VOLUME: redgiant-data
      REDGIANT_KV_DIR: /kv
      # The setup wizard downloads models here and starts the engine container next to RedGiant.
      REDGIANT_MODELS_DIR: /models
      REDGIANT_MODELS_VOLUME: redgiant-models
      REDGIANT_KV_VOLUME: redgiant-kv
      REDGIANT_ENGINE_NETWORK: redgiant_default
    ports:
      - "${REDGIANT_BIND:-127.0.0.1}:${REDGIANT_PORT:-7600}:7600"
    volumes:
      - redgiant-data:/data
      - ${REDGIANT_WIN_ENGINE_DIR:-./windows-engine}:/winengine
      - redgiant-kv:/kv
      - redgiant-models:/models
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [default, sandbox]

  # The only way out for the sandboxes: an allow list of domains, no private addresses.
  egress:
    image: *image
    restart: unless-stopped
    command: ["egress", "/etc/redgiant/egress.json", "3128"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3128,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
    volumes:
      - ${REDGIANT_EGRESS_POLICY:-./docker/egress.json}:/etc/redgiant/egress.json:ro
    networks: [default, sandbox]

  engine:
    profiles: [engine]
    image: ${REDGIANT_ENGINE_IMAGE:-ghcr.io/frostmoore/redgiant2-engine:cpu}
    restart: unless-stopped
    command: ["-m", "/models/${REDGIANT_ENGINE_MODEL:-model.gguf}"]
    volumes:
      - redgiant-models:/models
      - redgiant-kv:/kv

  engine-cuda:
    profiles: [engine-cuda]
    image: ${REDGIANT_ENGINE_CUDA_IMAGE:-ghcr.io/frostmoore/redgiant2-engine:cuda}
    restart: unless-stopped
    command: ["-m", "/models/${REDGIANT_ENGINE_MODEL:-model.gguf}", "--n-gpu-layers", "999"]
    volumes:
      - redgiant-models:/models
      - redgiant-kv:/kv
    networks:
      default:
        aliases: [engine]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # AMD, Intel and built-in GPUs on Linux, through Vulkan.
  engine-vulkan:
    profiles: [engine-vulkan]
    image: ${REDGIANT_ENGINE_VULKAN_IMAGE:-ghcr.io/frostmoore/redgiant2-engine:vulkan}
    restart: unless-stopped
    command: ["-m", "/models/${REDGIANT_ENGINE_MODEL:-model.gguf}", "--n-gpu-layers", "999"]
    volumes:
      - redgiant-models:/models
      - redgiant-kv:/kv
    devices:
      - /dev/dri:/dev/dri
    networks:
      default:
        aliases: [engine]

  searxng:
    profiles: [search]
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

  # Voice messages (profile "voice"): set http://whisper-asr:9000 in the wizard, or
  # REDGIANT_WHISPER_URL. Models download on first use into their own volume.
  whisper-asr:
    profiles: [voice]
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-small}
    volumes:
      - redgiant-whisper:/root/.cache

networks:
  default:
  # No route outside: sandboxes reach the internet only through the egress proxy.
  sandbox:
    name: redgiant-sandbox
    internal: true

volumes:
  redgiant-db:
  redgiant-data:
    name: redgiant-data
  redgiant-kv:
    name: redgiant-kv
  redgiant-models:
    name: redgiant-models
  redgiant-whisper:
