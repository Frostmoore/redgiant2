# Publishes the images when a version tag is pushed (git tag v1.16.0 && git push --tags).
# Run by hand (workflow_dispatch) on a branch it builds and publishes nothing: no image is pushed, no release.
# The patched engines (llama-cuda, engine-prefetch) are built only when their fingerprint is new
# (engine/fingerprint.sh, job engine-plan): otherwise the release reuses the zip kept in the
# pre-release `engine-cache` and the image tagged `cuda-prefetch-<fingerprint>`.
name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job only (llama-cuda: the patched llama.cpp for Windows; engine-prefetch: its Linux image). Nothing is published by hand"
        type: choice
        options: ["", "llama-cuda", "engine-prefetch"]
        default: ""
      cuda_archs:
        description: "CUDA architectures for llama-cuda and engine-prefetch (empty: the release's list)"
        type: string
        default: ""
      rebuild_engine:
        description: "Build the patched engines even when one with the same fingerprint exists"
        type: boolean
        default: false
      dry_run:
        description: "Only say, with the fingerprints, whether the patched engines would be reused or built; nothing else runs"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/frostmoore
  # The patched engines (G32.2): what goes into their fingerprint.
  LLAMA_BUILD: b12034
  CUDA_VERSION: 12.8.1
  # Turing to Blackwell; 89 (RTX 40) is the card it was measured on. Each "-real" is machine
  # code for that family only; 120 also carries PTX for newer cards.
  CUDA_ARCHS: ${{ inputs.cuda_archs || '75-real;80-real;86-real;89-real;90-real;120' }}
  # Where built zips are kept for the next releases: a pre-release (never "latest", so the app's
  # /releases/latest stays on the real release), its tag fixed on v3.2.0's commit.
  ENGINE_CACHE: engine-cache
  ZIP: llama-redgiant-win-cuda12.8-x64.zip

jobs:
  images:
    if: ${{ !inputs.only && !inputs.dry_run }}
    # The image is what Docker installations update to: the release's kind is published first.
    needs: release-info
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: redgiant2
            file: docker/redgiant.Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
            suffix: ""
          - name: redgiant2-sandbox
            file: docker/sandbox.Dockerfile
            context: docker
            platforms: linux/amd64,linux/arm64
            suffix: ""
          - name: redgiant2-engine
            file: docker/engine.Dockerfile
            context: docker
            platforms: linux/amd64,linux/arm64
            suffix: cpu
            variant: server
          - name: redgiant2-engine
            file: docker/engine.Dockerfile
            context: docker
            platforms: linux/amd64
            suffix: cuda
            variant: server-cuda
          # AMD, Intel and built-in GPUs (G24.3).
          - name: redgiant2-engine
            file: docker/engine.Dockerfile
            context: docker
            platforms: linux/amd64,linux/arm64
            suffix: vulkan
            variant: server-vulkan
          # compose.yaml's database (G36.1): postgres:17-alpine with pgvector, tagged by what it
          # holds (an existing volume opens as it is), not by RedGiant's version.
          - name: redgiant2-postgres
            file: docker/postgres.Dockerfile
            context: docker
            platforms: linux/amd64,linux/arm64
            suffix: ""
            fixed: "17-pgvector0.8.7 latest"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          image=$REGISTRY/${{ matrix.name }}
          if [ -n "${{ matrix.fixed }}" ]; then
            tags=""
            for t in ${{ matrix.fixed }}; do tags="${tags:+$tags,}$image:$t"; done
            echo "tags=$tags" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ matrix.suffix }}" ]; then
            echo "tags=$image:${{ matrix.suffix }},$image:$version-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:latest,$image:$version" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          # Only a version tag publishes: a run by hand never overwrites the released images.
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            REDGIANT_VERSION=${{ steps.tags.outputs.version }}
            ${{ matrix.variant && format('VARIANT={0}', matrix.variant) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.suffix }}

  # pgvector for the embedded Postgres (G36.1, pgvector.yml): built and loaded on Windows, Linux
  # and the Mac in seconds; the installers below carry it. A version tag also publishes the zips
  # missing from the pgvector-cache pre-release (source installs download them).
  pgvector:
    if: ${{ !inputs.only && !inputs.dry_run }}
    permissions:
      contents: write
    uses: ./.github/workflows/pgvector.yml
    with:
      publish: ${{ startsWith(github.ref, 'refs/tags/') }}

  # What the release is (G36.19): release.json from packaging/release-kind.json and the tag,
  # signed with UPDATE_SIGNING_KEY (the update key) and attached FIRST: the release exists with it
  # before any installer or app is attached, so no launcher or server ever meets this release's
  # files without its kind (a breaking release must never be taken for a normal one).
  release-info:
    if: ${{ !inputs.only && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: release.json, signed
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || version=0.0.0
          node packaging/update/release-info.mjs --version "$version" --out dist-info
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            node packaging/update/sign.mjs dist-info/release.json
          elif grep -q 'PublicKeyXml = ""' packaging/windows/launcher/UpdateKey.cs; then
            echo "::warning::release.json not signed (no key yet): its kind counts for nothing"
          else
            echo "UPDATE_SIGNING_KEY is missing: release.json must be signed"; exit 1
          fi
          cat dist-info/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: dist-info/*
          retention-days: 7
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-info/release.json
            dist-info/release.json.sig
          fail_on_unmatched_files: false
          generate_release_notes: true

  # The keychain's browser extension (G36.21): the zips for Chromium (Chrome, Edge, Brave, Opera)
  # and Firefox, with the release's version in their manifests, attached to the tag's release.
  browser-extension:
    if: ${{ !inputs.only && !inputs.dry_run }}
    needs: [release-info]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Build the extension
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b packages/protocol
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || version=0.0.0
          REDGIANT_VERSION="$version" pnpm --filter @redgiant/browser-extension build
      - uses: actions/upload-artifact@v4
        with:
          name: redgiant-keychain-extension
          path: packages/browser-extension/dist/*.zip
          retention-days: 7
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: packages/browser-extension/dist/*.zip
          fail_on_unmatched_files: true

  # RedGiant-Setup.exe (G22; 3.0, G30.2): the launcher, Node, the server built for Windows and the
  # web page, attached to the tag's GitHub Release. No WSL: everything runs on Windows itself.
  windows-installer:
    if: ${{ !inputs.only && !inputs.dry_run }}
    needs: [pgvector, release-info]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Build the server and the web page
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/download-artifact@v4
        with:
          name: pgvector-windows-x64
          path: pgv
      - name: Stage what the installer carries (server with its production modules, page, Node)
        shell: pwsh
        run: |
          # Built here, on Windows: the native parts (Postgres' binaries) are Windows' own.
          # Real folders, no links: the installer copies files, and Windows' junctions would not survive.
          pnpm --filter @redgiant/server deploy --prod --legacy --config.node-linker=hoisted packaging/windows/server
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The redgiant command line (G36.15) inside the server, so updates carry it.
          node packaging/cli/stage.mjs packaging/windows/server
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Codex and Claude Code (hundreds of MB) come down only when a subscription is switched on.
          Get-ChildItem packaging/windows/server/node_modules/@openai, packaging/windows/server/node_modules/@anthropic-ai -Directory | Where-Object { $_.Name -like "codex-win32-*" -or $_.Name -like "claude-agent-sdk-win32-*" } | Remove-Item -Recurse -Force
          # pgvector next to the server (G36.1): the embedded Postgres loads it from there.
          Expand-Archive (Get-Item pgv/pgvector-*-windows-x64.zip).FullName packaging/windows/server/pgvector
          Copy-Item -Recurse packages/web/dist packaging/windows/web
          $v = node -p "process.version"
          New-Item -ItemType Directory -Force packaging/windows/node | Out-Null
          Invoke-WebRequest "https://nodejs.org/dist/$v/node-$v-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-x
          Copy-Item "node-x/node-$v-win-x64/node.exe" packaging/windows/node/node.exe
          "{0:N0} MB staged" -f ((Get-ChildItem -Recurse packaging/windows/server, packaging/windows/web, packaging/windows/node | Measure-Object Length -Sum).Sum / 1MB)
      - name: Build the launcher (C# of .NET Framework, on every Windows)
        shell: pwsh
        working-directory: packaging/windows
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /target:winexe /out:RedGiant.exe /win32icon:redgiant.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Management.dll /r:System.Web.Extensions.dll launcher\RedGiant.cs launcher\Updates.cs launcher\Moves.cs launcher\Memory.cs launcher\Diag.cs launcher\Delta.cs launcher\UpdateKey.cs launcher\ReleaseInfo.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build the installer (Inno Setup)
        shell: pwsh
        working-directory: packaging/windows
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" RedGiant.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\RedGiant-Setup.exe | Format-List Name, Length
      # Differential updates (G36.18): the same files as a zip whose entries the launcher fetches
      # one by one (HTTP Range), and the manifest of their sizes and sha256. Signed with
      # UPDATE_SIGNING_KEY when the secret is there; once UpdateKey.cs holds a public key the
      # secret is required (sign.mjs fails otherwise, and with a key that does not match).
      - name: Differential update files (manifest, zip, signature)
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "0.0.0-dispatch" }
          $app = "$env:RUNNER_TEMP\app"
          New-Item -ItemType Directory -Force $app | Out-Null
          foreach ($d in "server", "web", "node") { Copy-Item -Recurse "packaging\windows\$d" "$app\$d" }
          Copy-Item packaging\windows\RedGiant.exe, packaging\windows\redgiant.ico $app
          New-Item -ItemType Directory -Force "$app\bin" | Out-Null
          Copy-Item packaging\windows\redgiant.cmd "$app\bin"
          node packaging/update/pack.mjs --tree $app --version $version --platform win-x64 --out packaging/windows/update --installer packaging/windows/dist/RedGiant-Setup.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $keyed = (Get-Content packaging\windows\launcher\UpdateKey.cs -Raw) -notmatch 'PublicKeyXml = ""'
          if ($env:UPDATE_SIGNING_KEY) {
            node packaging/update/sign.mjs packaging/windows/update/RedGiant-win-x64.manifest.json
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } elseif ($keyed) {
            "UpdateKey.cs holds a public key but the UPDATE_SIGNING_KEY secret is missing: the launchers would refuse this release's manifest"
            exit 1
          } else {
            "::warning::manifest not signed (no UPDATE_SIGNING_KEY): the launcher checks it against GitHub's digest only"
          }
          Get-ChildItem packaging/windows/update | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: RedGiant-win-x64-update
          path: packaging/windows/update/*
          compression-level: 0
          retention-days: 7
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            packaging/windows/dist/RedGiant-Setup.exe
            packaging/windows/update/RedGiant-win-x64.zip
            packaging/windows/update/RedGiant-win-x64.manifest.json
            packaging/windows/update/RedGiant-win-x64.manifest.json.gz
            packaging/windows/update/RedGiant-win-x64.manifest.json.sig
          fail_on_unmatched_files: false
          generate_release_notes: true

  # RedGiant for macOS (2026-11-05): signed with the Developer ID and notarized by Apple, so it
  # opens without warnings. Secrets: MAC_CERTIFICATE_P12 (the "Developer ID Application"
  # certificate exported as .p12, base64), MAC_CERTIFICATE_PASSWORD, MAC_NOTARY_KEY (an App Store
  # Connect API key, the .p8 file in base64), MAC_NOTARY_KEY_ID, MAC_NOTARY_ISSUER_ID.
  mac-app:
    if: ${{ !inputs.only && !inputs.dry_run }}
    needs: [pgvector, release-info]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: The certificate, in a keychain of this run only
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_NOTARY_KEY: ${{ secrets.MAC_NOTARY_KEY }}
        run: bash packaging/mac/keychain.sh
      - uses: actions/download-artifact@v4
        with:
          name: pgvector-macos-universal
          path: pgv
      - name: Build, sign, notarize
        env:
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
        run: PGVECTOR_ZIP="$(ls "$PWD"/pgv/pgvector-*-macos-universal.zip)" bash packaging/mac/build.sh "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: packaging/mac/dist/RedGiant-mac-*.dmg

  # Homebrew and winget (G36.10): the cask and the winget manifest made from this release's own
  # installers (the sha256 GitHub lists for them), attached to the release. The tap is updated
  # when HOMEBREW_TAP_TOKEN (a token that may push to Frostmoore/homebrew-redgiant) is set; winget
  # gets a pull request only when the repository variable WINGET_AUTO_SUBMIT is "true" and
  # WINGET_TOKEN is set: off until the person turns it on, after the first submission (made by
  # hand, docs/INSTALL.md) is accepted.
  stores:
    if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.only && !inputs.dry_run }}
    needs: [windows-installer, mac-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.files.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The cask and the manifest, from the release's assets
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          digest() {
            gh release view "$GITHUB_REF_NAME" --json assets \
              -q ".assets[] | select(.name == \"$1\") | .digest" | sed 's/^sha256://'
          }
          dmg=$(digest RedGiant-mac-arm64.dmg)
          setup=$(digest RedGiant-Setup.exe)
          [ -n "$dmg" ] && [ -n "$setup" ] || { echo "the release has no installers yet"; exit 1; }
          node packaging/stores/stores.mjs --version "$version" --dmg-sha256 "$dmg" \
            --setup-sha256 "$setup" --date "$(date -u +%F)" --out stores
          ruby -c stores/homebrew/Casks/redgiant.rb
          (cd stores/winget && zip -qr "../RedGiant-winget-$version.zip" manifests)
          cp stores/homebrew/Casks/redgiant.rb stores/redgiant.rb
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: stores
          path: stores/winget/manifests
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            stores/redgiant.rb
            stores/RedGiant-winget-*.zip
      - name: The Homebrew tap (when HOMEBREW_TAP_TOKEN is set)
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::no HOMEBREW_TAP_TOKEN: redgiant.rb is attached to the release, the tap is not updated"
            exit 0
          fi
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/Frostmoore/homebrew-redgiant.git" tap
          mkdir -p tap/Casks
          cp stores/homebrew/Casks/redgiant.rb tap/Casks/redgiant.rb
          cd tap
          git add Casks/redgiant.rb
          if git diff --cached --quiet; then echo "the tap already has it"; exit 0; fi
          git -c user.name="RedGiant release" -c user.email="actions@github.com" \
            commit -q -m "redgiant ${GITHUB_REF_NAME#v}"
          git push -q origin HEAD

  # winget's pull request (G36.10), only when the person turned it on (WINGET_AUTO_SUBMIT) after
  # the first submission was accepted: wingetcreate opens it from WINGET_TOKEN's fork.
  winget-submit:
    if: ${{ vars.WINGET_AUTO_SUBMIT == 'true' }}
    needs: stores
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stores
          path: manifests
      - name: wingetcreate submit
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { "WINGET_AUTO_SUBMIT is on but WINGET_TOKEN is missing"; exit 1 }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $dir = "manifests\f\Frostmoore\RedGiant\${{ needs.stores.outputs.version }}"
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # The patched engines' plan (G32.2): their fingerprints (engine/fingerprint.sh: llama.cpp's tag,
  # CUDA, the card families, engine/llama-patches and the build recipe) and, for each, "build" (a
  # new fingerprint, or rebuild_engine), "reuse" (built by an earlier release: copied into this one
  # in seconds) or "skip" (not asked; or a run by hand with nothing to publish, or dry_run: the
  # decision is written and the run stops there). In the log and in the run's summary.
  engine-plan:
    runs-on: ubuntu-latest
    outputs:
      win: ${{ steps.plan.outputs.win }}
      win_fp: ${{ steps.plan.outputs.win_fp }}
      linux: ${{ steps.plan.outputs.linux }}
      linux_fp: ${{ steps.plan.outputs.linux_fp }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          REBUILD: ${{ inputs.rebuild_engine }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          win_fp=$(engine/fingerprint.sh win)
          linux_fp=$(engine/fingerprint.sh linux)
          cached_zip="${ZIP%.zip}-$win_fp.zip"
          image="$REGISTRY/redgiant2-engine:cuda-prefetch-$linux_fp"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ENGINE_CACHE" --jq '.assets[].name' 2>/dev/null | grep -qxF "$cached_zip"; then win_have=yes; else win_have=no; fi
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then linux_have=yes; else linux_have=no; fi
          wanted() { if [ -z "$ONLY" ] || [ "$ONLY" = "$1" ]; then echo yes; else echo no; fi; }
          echo "| Engine | Fingerprint | Decision | Why |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          plan() { # name fingerprint wanted have where
            if [ "$3" != yes ]; then action=skip; why="not asked (only=$ONLY)"
            elif [ "$REBUILD" = true ]; then action=build; why="rebuild_engine"
            elif [ "$4" = yes ]; then action=reuse; why="already built: $5"
            else action=build; why="new fingerprint, not found: $5"; fi
            if [ "$action" != skip ] && [ "$PUBLISH" != true ]; then
              if [ "$DRY_RUN" = true ]; then why="$why; dry run, would $action: stopping here"; action=skip
              elif [ "$action" = reuse ]; then why="$why; run by hand, nothing to publish: stopping here"; action=skip; fi
            fi
            echo "::notice title=$1 engine $2::$action ($why)"
            echo "| $1 | \`$2\` | $action | $why |" >> "$GITHUB_STEP_SUMMARY"
          }
          plan Windows "$win_fp" "$(wanted llama-cuda)" "$win_have" "$ENGINE_CACHE/$cached_zip"
          echo "win=$action" >> "$GITHUB_OUTPUT"
          plan Linux "$linux_fp" "$(wanted engine-prefetch)" "$linux_have" "$image"
          echo "linux=$action" >> "$GITHUB_OUTPUT"
          echo "win_fp=$win_fp" >> "$GITHUB_OUTPUT"
          echo "linux_fp=$linux_fp" >> "$GITHUB_OUTPUT"

  # llama.cpp with RedGiant's patches for Windows and NVIDIA cards (G32.2): b12034 plus
  # engine/llama-patches (apply.ps1), CUDA 12.8 from NVIDIA's redistributable archives (no
  # installer), MSVC and Ninja (engine/build-win.ps1). The zip carries llama-server.exe with its
  # DLLs and CUDA's own (cudart, cuBLAS) and is attached to the release; RedGiant downloads it
  # only when the person turns on «Next layer ahead». Built only for a new fingerprint (1-3 hours),
  # then kept in engine-cache as llama-redgiant-win-cuda12.8-x64-<fingerprint>.zip.
  # Alone: Actions > Release images > Run workflow, only = llama-cuda.
  llama-cuda:
    needs: engine-plan
    if: needs.engine-plan.outputs.win == 'build'
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      CUDA_DIR: C:\cuda
      CACHED_ZIP: llama-redgiant-win-cuda12.8-x64-${{ needs.engine-plan.outputs.win_fp }}.zip
    steps:
      - uses: actions/checkout@v4
      - name: CUDA from the cache
        id: cuda-cache
        uses: actions/cache@v4
        with:
          path: C:\cuda
          key: cuda-redist-${{ env.CUDA_VERSION }}-win-${{ hashFiles('engine/llama-patches/cuda-redist.ps1') }}
      - name: CUDA's archives, checked against NVIDIA's sha256
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./engine/llama-patches/cuda-redist.ps1 -Out $env:CUDA_DIR -Version $env:CUDA_VERSION
      # CUDA 12.8 accepts Visual Studio 2017-2022 (MSVC 14.1x-14.4x): windows-latest has Visual
      # Studio 2026, so its 2022 toolset (v143) when it is installed, otherwise nvcc is told to
      # accept the newer one.
      - name: A Visual C++ CUDA 12.8 accepts
        id: msvc
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Select-Object -ExpandProperty Name
          "MSVC toolsets: $($tools -join ', ')"
          $v143 = $tools | Where-Object { $_ -like "14.4*" } | Sort-Object { [version]$_ } | Select-Object -Last 1
          if ($v143) { "toolset=$v143" >> $env:GITHUB_OUTPUT } else { "cudaflags=-allow-unsupported-compiler" >> $env:GITHUB_OUTPUT }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ steps.msvc.outputs.toolset }}
      - name: Ninja and sccache
        shell: pwsh
        run: |
          choco install ninja sccache -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\sccache
          key: sccache-llama-${{ env.LLAMA_BUILD }}-${{ env.CUDA_ARCHS }}-${{ hashFiles('engine/llama-patches/*') }}
          restore-keys: |
            sccache-llama-${{ env.LLAMA_BUILD }}-${{ env.CUDA_ARCHS }}-
            sccache-llama-${{ env.LLAMA_BUILD }}-
      - name: llama.cpp at its tag with RedGiant's patches, built and zipped
        shell: pwsh
        env:
          SCCACHE_DIR: ${{ runner.temp }}\sccache
          SCCACHE_CACHE_SIZE: 4G
        run: ./engine/build-win.ps1 -CudaFlags "${{ steps.msvc.outputs.cudaflags }}"
      - uses: actions/upload-artifact@v4
        with:
          name: llama-redgiant-win-cuda12.8-x64
          path: ${{ env.ZIP }}
          compression-level: 0
          retention-days: 14
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP }}
      - name: Kept in engine-cache for the next releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$ZIP" "$CACHED_ZIP"
          if ! gh release view "$ENGINE_CACHE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$ENGINE_CACHE" -R "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Engine cache (not a release)" \
              --notes "Patched llama.cpp builds kept by release.yml, named by their fingerprint (engine/fingerprint.sh). Download RedGiant from the latest release instead."
          fi
          gh release upload "$ENGINE_CACHE" "$CACHED_ZIP" -R "$GITHUB_REPOSITORY" --clobber

  # The fingerprint is known: the zip an earlier release built, attached to this release with the
  # name the app looks for (moe-prefetch.ts, RedGiant.cs: releases/download/v<version>/<zip>).
  llama-cuda-reuse:
    needs: engine-plan
    if: needs.engine-plan.outputs.win == 'reuse'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: The zip built for this fingerprint, from engine-cache
        env:
          GH_TOKEN: ${{ github.token }}
          CACHED_ZIP: llama-redgiant-win-cuda12.8-x64-${{ needs.engine-plan.outputs.win_fp }}.zip
        run: |
          gh release download "$ENGINE_CACHE" -R "$GITHUB_REPOSITORY" -p "$CACHED_ZIP"
          mv "$CACHED_ZIP" "$ZIP"
          ls -l "$ZIP"
          sha256sum "$ZIP"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true

  # The same patched llama.cpp for the engines in Docker (Linux, NVIDIA runtime), G32.2:
  # redgiant2-engine:cuda-prefetch, built from source (docker/engine-prefetch.Dockerfile: b12034 +
  # apply.sh, CUDA 12.8). Its own image, not the `cuda` one: that one stays llama.cpp's official
  # build (no compilation in every release, always llama.cpp's latest), and only those who turn the
  # option on download this one. Built only for a new fingerprint (~80 minutes), also tagged
  # cuda-prefetch-<fingerprint>. Alone: Run workflow with only = engine-prefetch (built, not pushed).
  engine-prefetch:
    needs: engine-plan
    if: needs.engine-plan.outputs.linux == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      # CUDA's devel image and the build need more room than the runner leaves free.
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          image=$REGISTRY/redgiant2-engine
          echo "tags=$image:cuda-prefetch,$image:$version-cuda-prefetch,$image:cuda-prefetch-${{ needs.engine-plan.outputs.linux_fp }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: engine
          file: docker/engine-prefetch.Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            LLAMA_BUILD=${{ env.LLAMA_BUILD }}
            CUDA_VERSION=${{ env.CUDA_VERSION }}
            CUDA_ARCHS=${{ env.CUDA_ARCHS }}
      - name: Size
        if: startsWith(github.ref, 'refs/tags/')
        run: docker buildx imagetools inspect "$REGISTRY/redgiant2-engine:cuda-prefetch"

  # The fingerprint is known: the image an earlier release built gets this release's tags, no build.
  engine-prefetch-reuse:
    needs: engine-plan
    if: needs.engine-plan.outputs.linux == 'reuse'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The image built for this fingerprint, tagged for this release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=${GITHUB_REF_NAME#v}
          image=$REGISTRY/redgiant2-engine
          docker buildx imagetools create -t "$image:cuda-prefetch" -t "$image:$version-cuda-prefetch" "$image:cuda-prefetch-${{ needs.engine-plan.outputs.linux_fp }}"
          docker buildx imagetools inspect "$image:cuda-prefetch"
