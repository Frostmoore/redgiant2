# Publishes the images when a version tag is pushed (git tag v1.16.0 && git push --tags).
name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/frostmoore

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: redgiant2
            file: docker/redgiant.Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
            suffix: ""
          - name: redgiant2-sandbox
            file: docker/sandbox.Dockerfile
            context: docker
            platforms: linux/amd64,linux/arm64
            suffix: ""
          - name: redgiant2-engine
            file: docker/engine.Dockerfile
            context: docker
            platforms: linux/amd64,linux/arm64
            suffix: cpu
            variant: server
          - name: redgiant2-engine
            file: docker/engine.Dockerfile
            context: docker
            platforms: linux/amd64
            suffix: cuda
            variant: server-cuda
          # AMD, Intel and built-in GPUs (G24.3).
          - name: redgiant2-engine
            file: docker/engine.Dockerfile
            context: docker
            platforms: linux/amd64,linux/arm64
            suffix: vulkan
            variant: server-vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          image=$REGISTRY/${{ matrix.name }}
          if [ -n "${{ matrix.suffix }}" ]; then
            echo "tags=$image:${{ matrix.suffix }},$image:$version-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:latest,$image:$version" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            REDGIANT_VERSION=${{ steps.tags.outputs.version }}
            ${{ matrix.variant && format('VARIANT={0}', matrix.variant) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.suffix }}

  # RedGiant-Setup.exe (G22): the WSL distribution, the launcher and the installer, attached to the
  # tag's GitHub Release.
  windows-rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and export the WSL distribution
        run: |
          docker build -f packaging/windows/rootfs.Dockerfile --build-arg REDGIANT_REF=${{ github.ref_name }} -t redgiant-rootfs .
          cid=$(docker create redgiant-rootfs)
          docker export "$cid" | gzip -6 > redgiant-rootfs.tar.gz
          ls -la redgiant-rootfs.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: redgiant-rootfs
          path: redgiant-rootfs.tar.gz
          compression-level: 0

  windows-installer:
    needs: windows-rootfs
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: redgiant-rootfs
          path: packaging/windows
      - name: Build the launcher (C# of .NET Framework, on every Windows)
        shell: pwsh
        working-directory: packaging/windows
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /target:winexe /out:RedGiant.exe /win32icon:redgiant.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Management.dll launcher\RedGiant.cs launcher\Updates.cs launcher\Moves.cs launcher\Memory.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build the installer (Inno Setup)
        shell: pwsh
        working-directory: packaging/windows
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" RedGiant.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\RedGiant-Setup.exe | Format-List Name, Length
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: packaging/windows/dist/RedGiant-Setup.exe
          generate_release_notes: true
