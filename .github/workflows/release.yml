# Publishes the images when a version tag is pushed (git tag v1.16.0 && git push --tags).
name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job only (llama-cuda: the patched llama.cpp for Windows, nothing published)"
        type: choice
        options: ["", "llama-cuda"]
        default: ""
      cuda_archs:
        description: "CUDA architectures for llama-cuda (empty: the release's list)"
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/frostmoore

jobs:
  images:
    if: inputs.only != 'llama-cuda'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: redgiant2
            file: docker/redgiant.Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
            suffix: ""
          - name: redgiant2-sandbox
            file: docker/sandbox.Dockerfile
            context: docker
            platforms: linux/amd64,linux/arm64
            suffix: ""
          - name: redgiant2-engine
            file: docker/engine.Dockerfile
            context: docker
            platforms: linux/amd64,linux/arm64
            suffix: cpu
            variant: server
          - name: redgiant2-engine
            file: docker/engine.Dockerfile
            context: docker
            platforms: linux/amd64
            suffix: cuda
            variant: server-cuda
          # AMD, Intel and built-in GPUs (G24.3).
          - name: redgiant2-engine
            file: docker/engine.Dockerfile
            context: docker
            platforms: linux/amd64,linux/arm64
            suffix: vulkan
            variant: server-vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          image=$REGISTRY/${{ matrix.name }}
          if [ -n "${{ matrix.suffix }}" ]; then
            echo "tags=$image:${{ matrix.suffix }},$image:$version-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:latest,$image:$version" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            REDGIANT_VERSION=${{ steps.tags.outputs.version }}
            ${{ matrix.variant && format('VARIANT={0}', matrix.variant) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.suffix }}

  # RedGiant-Setup.exe (G22; 3.0, G30.2): the launcher, Node, the server built for Windows and the
  # web page, attached to the tag's GitHub Release. No WSL: everything runs on Windows itself.
  windows-installer:
    if: inputs.only != 'llama-cuda'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Build the server and the web page
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Stage what the installer carries (server with its production modules, page, Node)
        shell: pwsh
        run: |
          # Built here, on Windows: the native parts (Postgres' binaries) are Windows' own.
          # Real folders, no links: the installer copies files, and Windows' junctions would not survive.
          pnpm --filter @redgiant/server deploy --prod --legacy --config.node-linker=hoisted packaging/windows/server
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Codex and Claude Code (hundreds of MB) come down only when a subscription is switched on.
          Get-ChildItem packaging/windows/server/node_modules/@openai, packaging/windows/server/node_modules/@anthropic-ai -Directory | Where-Object { $_.Name -like "codex-win32-*" -or $_.Name -like "claude-agent-sdk-win32-*" } | Remove-Item -Recurse -Force
          Copy-Item -Recurse packages/web/dist packaging/windows/web
          $v = node -p "process.version"
          New-Item -ItemType Directory -Force packaging/windows/node | Out-Null
          Invoke-WebRequest "https://nodejs.org/dist/$v/node-$v-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-x
          Copy-Item "node-x/node-$v-win-x64/node.exe" packaging/windows/node/node.exe
          "{0:N0} MB staged" -f ((Get-ChildItem -Recurse packaging/windows/server, packaging/windows/web, packaging/windows/node | Measure-Object Length -Sum).Sum / 1MB)
      - name: Build the launcher (C# of .NET Framework, on every Windows)
        shell: pwsh
        working-directory: packaging/windows
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /target:winexe /out:RedGiant.exe /win32icon:redgiant.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Management.dll launcher\RedGiant.cs launcher\Updates.cs launcher\Moves.cs launcher\Memory.cs launcher\Diag.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build the installer (Inno Setup)
        shell: pwsh
        working-directory: packaging/windows
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" RedGiant.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\RedGiant-Setup.exe | Format-List Name, Length
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: packaging/windows/dist/RedGiant-Setup.exe
          generate_release_notes: true

  # RedGiant for macOS (2026-11-05): signed with the Developer ID and notarized by Apple, so it
  # opens without warnings. Secrets: MAC_CERTIFICATE_P12 (the "Developer ID Application"
  # certificate exported as .p12, base64), MAC_CERTIFICATE_PASSWORD, MAC_NOTARY_KEY (an App Store
  # Connect API key, the .p8 file in base64), MAC_NOTARY_KEY_ID, MAC_NOTARY_ISSUER_ID.
  mac-app:
    if: inputs.only != 'llama-cuda'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: The certificate, in a keychain of this run only
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_NOTARY_KEY: ${{ secrets.MAC_NOTARY_KEY }}
        run: bash packaging/mac/keychain.sh
      - name: Build, sign, notarize
        env:
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
        run: bash packaging/mac/build.sh "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: packaging/mac/dist/RedGiant-mac-*.dmg

  # llama.cpp with RedGiant's patches for Windows and NVIDIA cards (G32.2): b12034 plus
  # engine/llama-patches (apply.ps1), CUDA 12.8 from NVIDIA's redistributable archives (no
  # installer), MSVC and Ninja. The zip carries llama-server.exe with its DLLs and CUDA's own
  # (cudart, cuBLAS) and is attached to the release; RedGiant downloads it only when the person
  # turns on «Next layer ahead». Alone: Actions > Release images > Run workflow, only = llama-cuda.
  llama-cuda:
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      LLAMA_BUILD: b12034
      CUDA_VERSION: 12.8.1
      CUDA_DIR: C:\cuda
      # Turing to Blackwell; 89 (RTX 40) is the card it was measured on. Each "-real" is machine
      # code for that family only; 120 also carries PTX for newer cards.
      CUDA_ARCHS: ${{ inputs.cuda_archs || '75-real;80-real;86-real;89-real;90-real;120' }}
      ZIP: llama-redgiant-win-cuda12.8-x64.zip
    steps:
      - uses: actions/checkout@v4
      - name: CUDA from the cache
        id: cuda-cache
        uses: actions/cache@v4
        with:
          path: C:\cuda
          key: cuda-redist-${{ env.CUDA_VERSION }}-win-${{ hashFiles('engine/llama-patches/cuda-redist.ps1') }}
      - name: CUDA's archives, checked against NVIDIA's sha256
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./engine/llama-patches/cuda-redist.ps1 -Out $env:CUDA_DIR -Version $env:CUDA_VERSION
      - name: llama.cpp at its tag, with RedGiant's patches
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:LLAMA_BUILD https://github.com/ggml-org/llama.cpp llama
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Location llama
          ../engine/llama-patches/apply.ps1
      # CUDA 12.8 accepts Visual Studio 2017-2022 (MSVC 14.1x-14.4x): windows-latest has Visual
      # Studio 2026, so its 2022 toolset (v143) when it is installed, otherwise nvcc is told to
      # accept the newer one.
      - name: A Visual C++ CUDA 12.8 accepts
        id: msvc
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Select-Object -ExpandProperty Name
          "MSVC toolsets: $($tools -join ', ')"
          $v143 = $tools | Where-Object { $_ -like "14.4*" } | Sort-Object { [version]$_ } | Select-Object -Last 1
          if ($v143) { "toolset=$v143" >> $env:GITHUB_OUTPUT } else { "cudaflags=-allow-unsupported-compiler" >> $env:GITHUB_OUTPUT }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ steps.msvc.outputs.toolset }}
      - name: Ninja and sccache
        shell: pwsh
        run: |
          choco install ninja sccache -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\sccache
          key: sccache-llama-${{ env.LLAMA_BUILD }}-${{ env.CUDA_ARCHS }}-${{ hashFiles('engine/llama-patches/*') }}
          restore-keys: |
            sccache-llama-${{ env.LLAMA_BUILD }}-${{ env.CUDA_ARCHS }}-
            sccache-llama-${{ env.LLAMA_BUILD }}-
      - name: Build
        shell: pwsh
        working-directory: llama
        env:
          SCCACHE_DIR: ${{ runner.temp }}\sccache
          SCCACHE_CACHE_SIZE: 4G
        run: |
          $env:CUDA_PATH = $env:CUDA_DIR
          $env:PATH = "$env:CUDA_DIR\bin;$env:PATH"
          cl 2>&1 | Select-Object -First 1
          nvcc --version
          sccache --start-server
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CUDA_COMPILER="$env:CUDA_DIR/bin/nvcc.exe" -DCUDAToolkit_ROOT="$env:CUDA_DIR" `
            -DCMAKE_CUDA_ARCHITECTURES="$env:CUDA_ARCHS" -DCMAKE_CUDA_FLAGS="${{ steps.msvc.outputs.cudaflags }}" `
            -DGGML_CUDA=ON -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON `
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Everything: with GGML_BACKEND_DL the CUDA and CPU backends are modules llama-server loads.
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit 1 }
          sccache --show-stats
      - name: The zip, with CUDA's and Visual C++'s libraries next to the program
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force pack
          Copy-Item llama/build/bin/llama-server.exe, llama/build/bin/*.dll $out
          Copy-Item "$env:CUDA_DIR/bin/cudart64_12.dll", "$env:CUDA_DIR/bin/cublas64_12.dll", "$env:CUDA_DIR/bin/cublasLt64_12.dll" $out
          # The Visual C++ runtime and OpenMP, so it runs where they are not installed.
          $redist = Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory | Where-Object { $_.Name -like "Microsoft.VC*.CRT" -or $_.Name -like "Microsoft.VC*.OpenMP" }
          foreach ($d in $redist) { Copy-Item "$($d.FullName)/*.dll" $out }
          Set-Content "$out/build.txt" "$env:LLAMA_BUILD + RedGiant patches (0001 teal, 0002 moe-prefetch), CUDA $env:CUDA_VERSION, $env:CUDA_ARCHS"
          foreach ($f in "llama-server.exe", "llama.dll", "ggml.dll", "ggml-base.dll", "ggml-cuda.dll", "cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll") {
            if (-not (Test-Path "$out/$f")) { throw "$f is missing" }
          }
          if (-not (Get-ChildItem "$out/ggml-cpu*.dll")) { throw "no ggml-cpu backend" }
          # No card here: it must start and say its version all the same.
          & "$out/llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path "$out/*" -DestinationPath $env:ZIP -CompressionLevel Optimal
          Get-ChildItem $out | Sort-Object Length -Descending | Format-Table Name, @{ n = "MB"; e = { [math]::Round($_.Length / 1MB, 1) } }
          "{0:N0} MB zipped" -f ((Get-Item $env:ZIP).Length / 1MB)
          (Get-FileHash -Algorithm SHA256 $env:ZIP).Hash
      - uses: actions/upload-artifact@v4
        with:
          name: llama-redgiant-win-cuda12.8-x64
          path: ${{ env.ZIP }}
          compression-level: 0
          retention-days: 14
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP }}
