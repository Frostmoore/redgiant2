name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint

  installers:
    runs-on: ${{ matrix.os }}
    # A hung installer or launcher must fail the run, not hold it for hours.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: shellcheck install.sh docker/entrypoint.sh packaging/mac/build.sh packaging/mac/keychain.sh
      - if: runner.os == 'Linux'
        run: REDGIANT_TOKEN=x POSTGRES_PASSWORD=y docker compose config -q
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }
      # The Windows launcher compiles with the C# compiler every Windows has (G22).
      - if: runner.os == 'Windows'
        shell: pwsh
        working-directory: packaging/windows
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /target:winexe /out:RedGiant.exe /win32icon:redgiant.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Management.dll /r:System.Web.Extensions.dll launcher\RedGiant.cs launcher\Updates.cs launcher\Moves.cs launcher\Memory.cs launcher\Diag.cs launcher\Delta.cs launcher\UpdateKey.cs launcher\ReleaseInfo.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Differential updates (G36.18): Delta.cs's tests and the tool the checks below use.
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /out:DeltaTests.exe /r:System.IO.Compression.dll /r:System.Web.Extensions.dll /r:System.Core.dll launcher\test\DeltaTests.cs launcher\Delta.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /out:UpdateTool.exe /r:System.IO.Compression.dll /r:System.Web.Extensions.dll launcher\test\UpdateTool.cs launcher\Delta.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\DeltaTests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Mandatory and breaking updates (G36.19): release.json's rules and signature.
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /out:ReleaseInfoTests.exe /r:System.IO.Compression.dll /r:System.Web.Extensions.dll /r:System.Core.dll launcher\test\ReleaseInfoTests.cs launcher\ReleaseInfo.cs launcher\Delta.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\ReleaseInfoTests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # The engine on Windows (G24.3b): RedGiant.exe downloads llama.cpp's Vulkan build, starts it
      # and reports. The runner has no GPU: the engine must be found and that must be said (no_gpu).
      - if: runner.os == 'Windows'
        shell: pwsh
        working-directory: packaging/windows
        run: |
          $dir = "$env:LOCALAPPDATA\RedGiant\engine"
          New-Item -ItemType Directory -Force "$dir\models" | Out-Null
          Set-Content "$dir\models\tiny.gguf" "not a model"
          $build = (Select-String -Path ..\..\packages\server\src\win-engine.ts -Pattern 'WIN_ENGINE_BUILD = "(b\d+)"').Matches[0].Groups[1].Value
          Set-Content "$dir\engine.json" ('{"id":"ci-1","model":"tiny.gguf","build":"' + $build + '","ctx":2048,"parallel":1}')
          $p = Start-Process .\RedGiant.exe -ArgumentList "--engine-only" -PassThru
          $status = $null
          for ($i = 0; $i -lt 180; $i++) {
            Start-Sleep 2
            if (Test-Path "$dir\engine-status.json") {
              $status = Get-Content "$dir\engine-status.json" -Raw | ConvertFrom-Json
              if ($status.state -in @("failed", "ready")) { break }
            }
          }
          Stop-Process $p -Force
          Get-Process llama-server -ErrorAction SilentlyContinue | Stop-Process -Force
          $status | Format-List
          if (-not (Test-Path "$dir\bin\current\llama-server.exe")) { "llama-server.exe was not installed"; exit 1 }
          if ($status.id -ne "ci-1" -or $status.state -ne "failed" -or $status.error -notin @("no_gpu", $null)) { "unexpected status"; exit 1 }
          if ("$($status.log)" -notmatch "llama|ggml|model") { "no engine log in the status"; exit 1 }
      # RedGiant 3.0 (G30.2): the whole installer, installed silently, started, answering, and
      # stopped the proper way, with no Node or Postgres left behind.
      - if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: runner.os == 'Windows'
        shell: pwsh
        # The launcher refuses unsigned manifests once UpdateKey.cs holds a key: the test feed is
        # signed with the repository's secret (pushes only; elsewhere the differential part is skipped).
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Real folders, no links: the installer copies files, and Windows' junctions would not survive.
          pnpm --filter @redgiant/server deploy --prod --legacy --config.node-linker=hoisted packaging/windows/server
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Codex and Claude Code (hundreds of MB) come down only when a subscription is switched on.
          Get-ChildItem packaging/windows/server/node_modules/@openai, packaging/windows/server/node_modules/@anthropic-ai -Directory | Where-Object { $_.Name -like "codex-win32-*" -or $_.Name -like "claude-agent-sdk-win32-*" } | Remove-Item -Recurse -Force
          # pgvector (G36.1), built here as the release does (seconds): next to the server.
          pwsh -NoProfile -File engine/pgvector/build-win.ps1 -Out pgv-out -Work "$env:RUNNER_TEMP\pgv"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive (Get-Item pgv-out\pgvector-*.zip).FullName packaging/windows/server/pgvector
          Copy-Item -Recurse packages/web/dist packaging/windows/web
          New-Item -ItemType Directory -Force packaging/windows/node | Out-Null
          Copy-Item (Get-Command node).Source packaging/windows/node/node.exe
          choco install innosetup -y --no-progress
          Push-Location packaging/windows
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=0.0.0-ci" RedGiant.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\RedGiant-Setup.exe | Format-List Name, Length
          # -Wait would also wait for whatever setup leaves running: only setup itself, with a limit.
          $setup = Start-Process dist\RedGiant-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LANG=en", '/TASKS=""' -PassThru
          if (-not $setup.WaitForExit(600000)) { "setup did not finish"; exit 1 }
          Pop-Location
          $app = "$env:LOCALAPPDATA\RedGiant"
          if (-not (Test-Path "$app\server\dist\main.js")) { "the server was not installed"; exit 1 }
          # Debug mode on: RedGiant.exe writes its own log and the server's output there.
          New-Item -ItemType Directory -Force "$app\engine" | Out-Null
          New-Item -ItemType File -Force "$app\engine\debug.on" | Out-Null
          Start-Process "$app\RedGiant.exe" -ArgumentList "--background"
          $up = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep 2
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7600/api/health -TimeoutSec 3 | Out-Null; $up = $true; break } catch {}
          }
          Get-Content "$app\engine\launcher-*.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
          if (-not $up) {
            "RedGiant did not answer. The server started by hand, for its error:"
            & "$app\RedGiant.exe" --quit | Out-Null
            $env:REDGIANT_TOKEN = "ci-token-0123456789abcdef0123456789"; $env:DATABASE_URL = "embedded"
            $env:REDGIANT_DATA_DIR = "$env:RUNNER_TEMP\rg-data"; $env:REDGIANT_PORT = "7699"
            $env:REDGIANT_WEB_DIR = "$app\web"
            $p = Start-Process "$app\node\node.exe" -ArgumentList "`"$app\server\dist\main.js`"" -RedirectStandardOutput out.txt -RedirectStandardError err.txt -PassThru
            Start-Sleep 60
            Get-Content out.txt, err.txt -ErrorAction SilentlyContinue | Select-Object -Last 60
            if (-not $p.HasExited) { $p.Kill() }
            exit 1
          }
          "answered after about $($i * 2) s"
          # pgvector from the installed folder (G36.1): the embedded Postgres loads it from outside
          # its installation (redgiant.conf), and CREATE EXTENSION works in RedGiant's database.
          if (-not (Test-Path "$app\server\pgvector\lib\vector.dll")) { "pgvector was not installed"; exit 1 }
          $conf = Get-Content "$app\data\postgres\redgiant.conf" -Raw
          if ($conf -notmatch "extension_control_path") { "the embedded Postgres does not use pgvector's folder"; $conf; exit 1 }
          $port = (Get-Content "$app\data\postgres\postmaster.pid")[3].Trim()
          $env:PGV_PASSWORD = (Get-Content "$app\data\postgres.json" -Raw | ConvertFrom-Json).password
          $env:PGV_PORT = $port
          @'
          const { createRequire } = require("node:module");
          const pg = createRequire(process.env.PGV_SERVER + "/package.json")("pg");
          (async () => {
            const c = new pg.Client({ host: "127.0.0.1", port: +process.env.PGV_PORT, user: "redgiant", password: process.env.PGV_PASSWORD, database: "redgiant" });
            await c.connect();
            await c.query("CREATE EXTENSION IF NOT EXISTS vector");
            const v = (await c.query("SELECT extversion FROM pg_extension WHERE extname = 'vector'")).rows[0].extversion;
            const d = (await c.query("SELECT '[1,0,0]'::halfvec <=> '[0,1,0]'::halfvec AS d")).rows[0].d;
            console.log("pgvector " + v + ", cosine distance " + d);
            await c.end();
          })().catch((e) => { console.error(e.message); process.exit(1); });
          '@ | Set-Content "$env:RUNNER_TEMP\pgv-check.cjs"
          $env:PGV_SERVER = "$app\server"
          & "$app\node\node.exe" "$env:RUNNER_TEMP\pgv-check.cjs"
          if ($LASTEXITCODE -ne 0) { "CREATE EXTENSION vector failed in the installed RedGiant"; exit 1 }
          # RedGiant closed badly with Postgres left running (3.0.0 on Rig, 2026-11-05): setup run
          # again must still replace every file ("Accesso negato" before) and stop that Postgres.
          Stop-Process -Name RedGiant -Force
          Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$app*" } | Stop-Process -Force
          Start-Sleep 2
          $orphans = @(Get-Process postgres -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$app*" } | ForEach-Object { $_.Id })
          "Postgres left running on purpose: $($orphans.Count) processes"
          if ($orphans.Count -eq 0) { "the test needs a Postgres left running"; exit 1 }
          $again = Start-Process packaging\windows\dist\RedGiant-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LANG=en", '/TASKS=""' -PassThru
          if (-not $again.WaitForExit(600000)) { "setup over a running Postgres did not finish"; exit 1 }
          if ($again.ExitCode -ne 0) { "setup over a running Postgres failed: $($again.ExitCode)"; exit 1 }
          $still = @(Get-Process postgres -ErrorAction SilentlyContinue | Where-Object { $orphans -contains $_.Id })
          if ($still.Count -gt 0) { "the old Postgres is still running after setup"; exit 1 }
          "setup replaced the files and stopped the old Postgres"
          # An update opens RedGiant again by itself: it answers once more.
          $up = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep 2
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7600/api/health -TimeoutSec 3 | Out-Null; $up = $true; break } catch {}
          }
          if (-not $up) { "RedGiant did not come back after the update"; exit 1 }
          # Differential update (G36.18), the real launcher end to end: a release of its own
          # (range-server.mjs: 302 then 206 as GitHub, the API's digest), RedGiant.exe --update-now.
          # 0.0.1 changes two files: only those come down, the swap restarts RedGiant as 0.0.1.
          $feed = "$env:RUNNER_TEMP\feed"; $next = "$env:RUNNER_TEMP\next"
          function Pack-Version($v, [scriptblock]$change) {
            Remove-Item -Recurse -Force $next, $feed -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $next, $feed | Out-Null
            foreach ($d in "server", "web", "node") { Copy-Item -Recurse "packaging\windows\$d" "$next\$d" }
            Copy-Item packaging\windows\RedGiant.exe, packaging\windows\redgiant.ico $next
            & $change
            node packaging/update/pack.mjs --tree $next --version $v --platform win-x64 --out $feed --installer packaging\windows\dist\RedGiant-Setup.exe
            if ($LASTEXITCODE -ne 0) { exit 1 }
            if ($env:UPDATE_SIGNING_KEY) {
              node packaging/update/sign.mjs "$feed\RedGiant-win-x64.manifest.json"
              if ($LASTEXITCODE -ne 0) { exit 1 }
            }
            Copy-Item packaging\windows\dist\RedGiant-Setup.exe $feed
          }
          function Wait-Version($v) {
            for ($i = 0; $i -lt 150; $i++) {
              Start-Sleep 2
              $now = (Get-ItemProperty HKCU:\Software\RedGiant).Version
              if ($now -eq $v) { try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7600/api/health -TimeoutSec 3 | Out-Null; return $true } catch {} }
            }
            Get-Content "$app\engine\launcher-*.log" -ErrorAction SilentlyContinue | Select-String "update" | Select-Object -Last 40
            return $false
          }
          if ($env:UPDATE_SIGNING_KEY) {
            Pack-Version "0.0.1" { Add-Content "$next\web\index.html" "<!-- 0.0.1 -->"; Set-Content "$next\server\dist\ci-marker.js" "export {};" }
            .\packaging\windows\DeltaTests.exe $feed $next
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $srv = Start-Process node -ArgumentList "packaging/update/range-server.mjs", $feed, "18765", "0.0.1" -PassThru
            Start-Sleep 2
            & "$app\RedGiant.exe" --quit | Out-Null
            $env:REDGIANT_UPDATE_FEED = "http://127.0.0.1:18765/release.json"
            Start-Process "$app\RedGiant.exe" -ArgumentList "--background", "--update-now"
            if (-not (Wait-Version "0.0.1")) { "the differential update to 0.0.1 did not finish"; exit 1 }
            $served = [long](Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18765/served).Content
            "0.0.1 in place, $served bytes downloaded of a $((Get-Item "$feed\RedGiant-win-x64.zip").Length)-byte zip"
            # What it must cost: the gzipped manifest, its signature if any, and the two changed entries
            # (one range each: they sit far apart in the zip). 64 KB of slack for nothing else.
            $m = Get-Content "$feed\RedGiant-win-x64.manifest.json" -Raw | ConvertFrom-Json
            $changed = ($m.files | Where-Object { $_.path -in @("web/index.html", "server/dist/ci-marker.js") } | Measure-Object csize -Sum).Sum
            $expected = (Get-Item "$feed\RedGiant-win-x64.manifest.json.gz").Length + $changed
            if (Test-Path "$feed\RedGiant-win-x64.manifest.json.sig") { $expected += (Get-Item "$feed\RedGiant-win-x64.manifest.json.sig").Length }
            "expected about $expected bytes (manifest.gz + $changed bytes of entries)"
            if ($served -gt $expected + 64KB) { "too much downloaded for two files"; Get-Content "$app\engine\launcher-*.log" -ErrorAction SilentlyContinue | Select-String "differential" | Select-Object -Last 5; exit 1 }
            & packaging\windows\UpdateTool.exe verify "$feed\RedGiant-win-x64.manifest.json" $app
            if ($LASTEXITCODE -ne 0) { "the folder is not 0.0.1"; exit 1 }
            for ($i = 0; $i -lt 30 -and (Test-Path "$app\update\0.0.1"); $i++) { Start-Sleep 2 }
            if (Test-Path "$app\update\0.0.1") { "the old version was not cleaned up"; exit 1 }
            if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F0E3B52-8D4A-4C1E-9B7A-2E1D5C9F4A10}_is1").DisplayVersion -ne "0.0.1") { "Windows' list still shows the old version"; exit 1 }
            Stop-Process $srv -Force
            # 0.0.2's server stops at once: the trial fails, 0.0.1 comes back by itself and answers.
            Pack-Version "0.0.2" { Add-Content "$next\web\index.html" "<!-- 0.0.1 -->"; Set-Content "$next\server\dist\ci-marker.js" "export {};"; Set-Content "$next\server\dist\main.js" "process.exit(1);" }
            $srv = Start-Process node -ArgumentList "packaging/update/range-server.mjs", $feed, "18765", "0.0.2" -PassThru
            Start-Sleep 2
            & "$app\RedGiant.exe" --quit | Out-Null
            Start-Process "$app\RedGiant.exe" -ArgumentList "--background", "--update-now"
            # Rolled back: the broken version is remembered (the next update uses the installer).
            for ($i = 0; $i -lt 150 -and (Get-ItemProperty HKCU:\Software\RedGiant).UpdateBroken -ne "0.0.2"; $i++) { Start-Sleep 2 }
            if ((Get-ItemProperty HKCU:\Software\RedGiant).UpdateBroken -ne "0.0.2") { "the failed 0.0.2 was not rolled back"; Get-Content "$app\engine\launcher-*.log" -ErrorAction SilentlyContinue | Select-Object -Last 40; exit 1 }
            if (-not (Wait-Version "0.0.1")) { "0.0.1 did not come back after the failed 0.0.2"; exit 1 }
            if ((Get-Content "$app\server\dist\main.js" -Raw) -match "process.exit") { "the broken server stayed"; exit 1 }
            "0.0.2 failed on trial and 0.0.1 came back"
            Stop-Process $srv -Force
            # G36.19: 0.0.3 is signed "breaking": RedGiant.exe must not touch the installed files,
            # not even with --update-now (no differential, no installer over it).
            Pack-Version "0.0.3" { Add-Content "$next\web\index.html" "<!-- 0.0.3 -->" }
            '{"version":"0.0.3","kind":"breaking","minVersion":null,"note":{"it":"Prova","en":"Test"},"requiredBelow":null,"cleanInstallBelow":null}' | Set-Content "$env:RUNNER_TEMP\kind.json"
            node packaging/update/release-info.mjs --version 0.0.3 --kind-file "$env:RUNNER_TEMP\kind.json" --out $feed
            if ($LASTEXITCODE -ne 0) { exit 1 }
            node packaging/update/sign.mjs "$feed\release.json"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $srv = Start-Process node -ArgumentList "packaging/update/range-server.mjs", $feed, "18765", "0.0.3" -PassThru
            Start-Sleep 2
            & "$app\RedGiant.exe" --quit | Out-Null
            Start-Process "$app\RedGiant.exe" -ArgumentList "--background", "--update-now"
            if (-not (Wait-Version "0.0.1")) { "RedGiant did not start again as 0.0.1"; exit 1 }
            Start-Sleep 20
            $served = [long](Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18765/served).Content
            $info = (Get-Item "$feed\release.json").Length + (Get-Item "$feed\release.json.sig").Length
            "breaking 0.0.3: $served bytes served (release.json and its signature: $info)"
            if ((Get-ItemProperty HKCU:\Software\RedGiant).Version -ne "0.0.1") { "a breaking release was installed in place"; exit 1 }
            if ($served -gt $info + 4KB) { "a breaking release's files were downloaded"; exit 1 }
            if ((Get-Content "$app\web\index.html" -Raw) -match "0.0.3") { "the breaking release's files reached the app"; exit 1 }
            Stop-Process $srv -Force
            Remove-Item Env:\REDGIANT_UPDATE_FEED
          } else {
            "::warning::no UPDATE_SIGNING_KEY here (a pull request from a fork): the differential update is not tried"
          }
          & "$app\RedGiant.exe" --quit | Out-Null
          Start-Sleep 5
          $left = @(Get-Process node, postgres -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$app*" })
          if ($left.Count -gt 0) { $left | Format-Table Id, ProcessName, Path; "processes left after --quit"; exit 1 }
          # Uninstalled silently: it must end by itself (a plain MsgBox waited forever, 2026-11-05),
          # remove the program and keep the data.
          $un = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $un.WaitForExit(180000)) { "the uninstaller did not finish"; exit 1 }
          # It runs again from a temporary copy: wait for the program to be gone, with a limit.
          for ($i = 0; $i -lt 90 -and (Test-Path "$app\server\dist\main.js"); $i++) { Start-Sleep 2 }
          if (Test-Path "$app\server\dist\main.js") { "the uninstaller left the server"; exit 1 }
          if (-not (Test-Path "$app\data\postgres")) { "the uninstaller removed the data"; exit 1 }
          "uninstalled, data kept"

  # RedGiant for macOS (2026-11-05): the app built (signed ad-hoc here), started from its disk
  # image, answering, stopped the proper way with nothing left running, its data where it belongs.
  mac-app:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile && pnpm build
      # Signed with the Developer ID when the repository has it (hardened runtime: Node, Postgres
      # and the native modules must run under it), not notarized: that is the release's.
      - name: The certificate, in a keychain of this run only
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: bash packaging/mac/keychain.sh
      - run: bash packaging/mac/build.sh 0.0.0-ci
      - name: Install from the disk image, start, stop
        run: |
          set -euo pipefail
          hdiutil attach packaging/mac/dist/RedGiant-mac-*.dmg -mountpoint /tmp/rg-dmg -nobrowse -quiet
          cp -R /tmp/rg-dmg/RedGiant.app /tmp/RedGiant.app
          hdiutil detach /tmp/rg-dmg -quiet
          codesign --verify --deep --strict /tmp/RedGiant.app
          codesign -dv --verbose=2 /tmp/RedGiant.app 2>&1 | grep -E "Authority=Developer|TeamIdentifier|flags" || true
          /tmp/RedGiant.app/Contents/MacOS/RedGiant --background &
          up=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:7600/api/health >/dev/null; then up=1; echo "answered after about $((i * 2)) s"; break; fi
            sleep 2
          done
          tail -40 ~/Library/Logs/RedGiant/server.log || true
          [ "$up" = 1 ] || { echo "RedGiant did not answer"; exit 1; }
          token=$(cat ~/Library/Application\ Support/RedGiant/data/token.txt)
          curl -sf -H "Authorization: Bearer $token" http://127.0.0.1:7600/api/setup >/dev/null
          curl -sf http://127.0.0.1:7600/ | grep -q "<html"
          # pgvector (G36.1): the signed postgres loads the signed vector.dylib from the app's own
          # folder (hardened runtime, library validation), and CREATE EXTENSION works.
          data=~/Library/Application\ Support/RedGiant/data
          grep -q extension_control_path "$data/postgres/redgiant.conf" || { echo "the embedded Postgres does not use pgvector's folder"; exit 1; }
          # shellcheck disable=SC2016 # the $1 below are SQL parameters, for node
          PGV_PORT=$(sed -n 4p "$data/postgres/postmaster.pid" | tr -d ' ') \
          PGV_PASSWORD=$(/tmp/RedGiant.app/Contents/Resources/node/node -p "require(process.argv[1]).password" "$data/postgres.json") \
          PGV_SERVER=/tmp/RedGiant.app/Contents/Resources/server \
          /tmp/RedGiant.app/Contents/Resources/node/node -e '
            const pg = require("node:module").createRequire(process.env.PGV_SERVER + "/package.json")("pg");
            (async () => {
              const c = new pg.Client({ host: "127.0.0.1", port: +process.env.PGV_PORT, user: "redgiant", password: process.env.PGV_PASSWORD, database: "redgiant" });
              await c.connect();
              await c.query("CREATE EXTENSION IF NOT EXISTS vector");
              const v = (await c.query("SELECT extversion FROM pg_extension WHERE extname = $1", ["vector"])).rows[0].extversion;
              const d = (await c.query("SELECT $1::halfvec <=> $2::halfvec AS d", ["[1,0,0]", "[0,1,0]"])).rows[0].d;
              console.log("pgvector " + v + ", cosine distance " + d);
              await c.end();
            })().catch((e) => { console.error(e.message); process.exit(1); });'
          /tmp/RedGiant.app/Contents/MacOS/RedGiant --quit
          sleep 3
          if pgrep -fl "RedGiant.app/Contents/Resources" ; then echo "processes left after --quit"; exit 1; fi
          [ -d ~/Library/Application\ Support/RedGiant/data/postgres ] || { echo "no database in the data folder"; ls -R ~/Library/Application\ Support/RedGiant | head -30; exit 1; }
          echo "started, answered, stopped; data kept"
      - uses: actions/upload-artifact@v4
        with:
          name: RedGiant-mac
          path: packaging/mac/dist/RedGiant-mac-*.dmg
          retention-days: 3
