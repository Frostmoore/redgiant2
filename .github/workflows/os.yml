# RedGiant OS (G39.1, G39.2): builds the images on GitHub's runners (x86_64 and arm64, each on its
# own processor), boots every one in QEMU headless and checks it (packaging/os/test/boot-test.sh).
# Runs by hand, on every push to a version branch, on a work branch when the OS's files change,
# and from release.yml for a tag (publish: the images are attached to the release with SHA256SUMS
# signed like release.json). The release does that only while the repository variable
# REDGIANT_OS_RELEASE is "true".
# A version branch's run is the release's own (3.7.4): it first builds the Docker images of its
# commit (images.yml, tags ci-<version>-<sha>), then the OS with their stack and the version of
# packaging/release-kind.json. release.yml on the tag copies those images to the version's tags
# and attaches this run's images (reuse_run, after reuse.mjs checks they carry the release's stack
# and files) instead of building them again; it builds them here only when no such run is left.
name: RedGiant OS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "RedGiant version whose images the OS carries (empty: the latest release)"
        type: string
        default: ""
      arm64:
        description: "Also build and boot the arm64 images (emulated boot: slow)"
        type: boolean
        default: true
      only:
        description: "Only these formats, comma separated (qcow2,raw,iso,vhdx,ova,lxc,raspi); empty: all"
        type: string
        default: ""
      preview:
        description: "Put what this run builds on the pre-release os-preview (signed; never the latest release)"
        type: boolean
        default: false
      quick:
        description: "amd64 only: build the qcow2, boot it (UEFI, HTTPS included), then the Wi-Fi checks"
        type: boolean
        default: false
  # Every version branch's push; a work branch's only when it touches the OS (job plan).
  push:
    branches: ["p[0-9]*", "a[0-9]*", "b[0-9]*"]
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish:
        type: boolean
        default: false
      # 3.7.4: attach this earlier run's images (release.yml found them reusable) instead of building.
      reuse_run:
        type: string
        default: ""
      # Check and sign what would be attached, attach nothing.
      dry_run:
        type: boolean
        default: false
      # The commit the release is made from (empty: this run's).
      sha:
        type: string
        default: ""
      # With dry_run: the images the stack is checked against (ci-<version>-<sha>), not yet copied.
      expect_tag:
        type: string
        default: ""

permissions:
  contents: read

# A newer push to the same branch replaces a build still running (a tag's run is never cancelled);
# runs by hand for other formats ('only') do not replace each other.
concurrency:
  group: os-${{ github.ref }}-${{ github.event_name }}-${{ inputs.only }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # What this run does (3.7.4):
  # - build: false when release.yml reuses an earlier run (reuse_run), or a work branch does not
  #   touch the OS (packaging/os, the helper, this file).
  # - release: a version branch's push with a version in release-kind.json: the Docker images of
  #   this commit first (ci tags), the OS with them and that version.
  # - otherwise (by hand, work branches, a tag's build): the images of `version`, else the latest
  #   release's, as before.
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      source_tag: ${{ steps.plan.outputs.source_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/release-kind.json
          sparse-checkout-cone-mode: false
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REUSE_RUN: ${{ inputs.reuse_run }}
          DRY_RUN: ${{ inputs.dry_run }}
          WANTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version_branch='^[pab][0-9]+[.][0-9]+[.][0-9]+$'
          build=true release=false version="" source_tag="" why=""
          if [ -n "$REUSE_RUN" ]; then
            build=false; why="release.yml reuses run $REUSE_RUN"
          elif [ "$DRY_RUN" = true ]; then
            build=false; why="dry run: nothing reusable, the images would be built"
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && [[ "$GITHUB_REF_NAME" =~ $version_branch ]]; then
            version=$(node -p "require('./packaging/release-kind.json').version")
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              release=true; source_tag="ci-$version-$GITHUB_SHA"
              why="version branch: the Docker images of this commit ($source_tag), the OS of $version"
            else
              version=""; why="version branch without a version in release-kind.json: the latest release's images"
            fi
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            # A work branch: only when it touches the OS. The whole branch against the default one, not
            # this push alone: a later push that does not touch it still replaces (cancels) a build
            # of the earlier one, so it must build too.
            base=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
            changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null || echo "?")
            # The API lists 300 files at most: past that, build rather than guess.
            if grep -qE '^(packaging/os/|packages/server/helpers/|\.github/workflows/os\.yml$|\?$)' <<<"$changed" || [ "$(wc -l <<<"$changed")" -ge 300 ]; then
              why="a work branch that touches the OS"
            else
              build=false; why="a work branch that does not touch the OS"
            fi
          fi
          if [ "$build" = true ] && [ -z "$version" ]; then
            version="${WANTED#v}"
            [ -n "$version" ] || version=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name | sed 's/^v//')
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version: $version"; exit 1; }
          fi
          echo "::notice title=RedGiant OS::build=$build release=$release version=${version:-none} ($why)"
          {
            echo "build=$build"
            echo "release=$release"
            echo "version=$version"
            echo "source_tag=$source_tag"
          } >> "$GITHUB_OUTPUT"

  # The Docker images of this commit (version branches): RedGiant OS is built with these.
  images:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      sha: ${{ github.sha }}
      tags: ci
      push: true

  stack:
    needs: [plan, images]
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: v
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # On a version branch from this commit's images (ci tags), the references naming the
      # release's tags: the release copies them there with the same digests.
      - name: The stack, pinned by digest
        env:
          SOURCE_TAG: ${{ needs.plan.outputs.source_tag }}
        run: |
          mkdir -p dist
          node packaging/os/stack.mjs --version "${{ steps.v.outputs.version }}" --source-tag "$SOURCE_TAG" --out dist/redgiant-os-stack.json
      # The system's own files (p3.7.3): an update installs them before the new containers.
      - name: The system's files
        run: node packaging/os/files.mjs --version "${{ steps.v.outputs.version }}" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: redgiant-os-stack
          path: |
            dist/redgiant-os-stack.json
            dist/redgiant-os-files.json
            dist/redgiant-os-files-*.tar.zst
          retention-days: 7

  build:
    needs: stack
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            formats: qcow2,raw,iso,vhdx,ova
          - arch: arm64
            runner: ubuntu-24.04-arm
            formats: qcow2,raw
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      OUT: /mnt/os
    steps:
      - name: What to build (arm64 when wanted, the formats asked for, the qcow2 alone when quick)
        env:
          ONLY: ${{ inputs.only }}
          QUICK: ${{ github.event_name == 'workflow_dispatch' && inputs.quick }}
          NO_ARM64: ${{ matrix.arch == 'arm64' && github.event_name == 'workflow_dispatch' && (!inputs.arm64 || inputs.quick) }}
        run: |
          f="${{ matrix.formats }}"
          if [ -n "$ONLY" ]; then f=$(comm -12 <(tr , '\n' <<<"$f" | sort) <(tr , '\n' <<<"$ONLY" | tr -d ' ' | sort) | paste -sd,); fi
          [ "$QUICK" = true ] && f=qcow2 && echo "QUICK=1" >> "$GITHUB_ENV"
          [ "$NO_ARM64" = true ] && f=""
          echo "FORMATS=$f" >> "$GITHUB_ENV"
          [ -n "$f" ] || echo "SKIP=1" >> "$GITHUB_ENV"
          echo "formats: ${f:-none}"
      - uses: actions/checkout@v4
        if: ${{ env.SKIP != '1' }}
      - uses: actions/download-artifact@v4
        if: ${{ env.SKIP != '1' }}
        with:
          name: redgiant-os-stack
          path: stack
      - name: Room on the disk
        if: ${{ env.SKIP != '1' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p "$OUT" && sudo chown "$(id -u):$(id -g)" "$OUT"
          df -h / "$OUT"
      - name: Build (mmdebstrap, systemd-repart)
        if: ${{ env.SKIP != '1' }}
        run: |
          docker build -q -f packaging/os/builder.Dockerfile -t redgiant-os-builder packaging/os
          cp stack/redgiant-os-stack.json "$OUT/"
          docker run --rm --privileged -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/src" -v "$OUT:/out" redgiant-os-builder \
            /src/packaging/os/build.sh --arch ${{ matrix.arch }} --stack /out/redgiant-os-stack.json \
            --out /out --formats "$FORMATS"
          sudo rm -rf "$OUT"/work-*
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          ls -la "$OUT"
      - name: QEMU
        if: ${{ env.SKIP != '1' }}
        run: |
          sudo apt-get update -q
          if [ "${{ matrix.arch }}" = amd64 ]; then
            sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf
          else
            sudo apt-get install -y -q --no-install-recommends qemu-system-arm qemu-utils qemu-efi-aarch64
          fi
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; echo "KVM: yes"; else echo "KVM: no (emulated)"; fi
      - name: Boot the qcow2 (UEFI) and check, HTTPS included
        if: ${{ env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'qcow2') }}
        timeout-minutes: 50
        run: packaging/os/test/boot-test.sh boot --arch amd64 --firmware uefi --disk "$OUT"/redgiant-os-*-x86_64.qcow2 --logs logs --work "$RUNNER_TEMP/uefi" --timeout 2400
      - name: Wi-Fi checks (mac80211_hwsim and hostapd in the machine)
        if: ${{ always() && env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'qcow2') }}
        timeout-minutes: 50
        run: packaging/os/test/boot-test.sh boot --arch amd64 --firmware uefi --wifi --disk "$OUT"/redgiant-os-*-x86_64.qcow2 --logs logs/wifi --work "$RUNNER_TEMP/wifi" --timeout 2400
      - name: Boot the qcow2 (UEFI, Secure Boot) and check
        if: ${{ env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'qcow2') && env.QUICK != '1' }}
        timeout-minutes: 50
        run: packaging/os/test/boot-test.sh boot --arch amd64 --firmware uefi --secureboot --disk "$OUT"/redgiant-os-*-x86_64.qcow2 --logs logs --timeout 2400
      - name: Boot the qcow2 (BIOS) and check
        if: ${{ env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'qcow2') && env.QUICK != '1' }}
        timeout-minutes: 50
        run: packaging/os/test/boot-test.sh boot --arch amd64 --firmware bios --disk "$OUT"/redgiant-os-*-x86_64.qcow2 --logs logs --timeout 2400
      - name: Install from the ISO (BIOS), then boot the installed disk (UEFI) and check
        if: ${{ env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'iso') && env.QUICK != '1' }}
        timeout-minutes: 80
        run: |
          packaging/os/test/boot-test.sh install --firmware bios --iso "$OUT"/redgiant-os-*-x86_64.iso --disk "$RUNNER_TEMP/installed.qcow2" --logs logs --timeout 1800
          packaging/os/test/boot-test.sh boot --arch amd64 --firmware uefi --disk "$RUNNER_TEMP/installed.qcow2" --logs logs --timeout 2400
      - name: Boot the qcow2 (arm64, UEFI) and check
        if: ${{ env.SKIP != '1' && matrix.arch == 'arm64' && contains(env.FORMATS, 'qcow2') }}
        run: packaging/os/test/boot-test.sh boot --arch arm64 --firmware uefi --disk "$OUT"/redgiant-os-*-arm64.qcow2 --logs logs --timeout 7200
        timeout-minutes: 130
        # Emulated: the first start loads RedGiant's images for many minutes before the self-test.
        env:
          START_LIMIT: 5400
      # Hyper-V and VirtualBox/VMware (G39.2): the same disk through their files. The VHDX boots with
      # UEFI, the OVA's VMDK with the BIOS VirtualBox uses and the E1000 card both offer.
      - name: Boot the VHDX (UEFI) and check
        if: ${{ env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'vhdx') }}
        timeout-minutes: 50
        run: |
          mkdir -p "$RUNNER_TEMP/vhdx"
          unzip -q "$OUT"/redgiant-os-*-x86_64.vhdx.zip -d "$RUNNER_TEMP/vhdx"
          qemu-img info "$RUNNER_TEMP"/vhdx/*.vhdx
          packaging/os/test/boot-test.sh boot --arch amd64 --firmware uefi --disk "$RUNNER_TEMP"/vhdx/*.vhdx --logs logs/vhdx --timeout 2400
          rm -rf "$RUNNER_TEMP/vhdx"
      - name: Check the OVA, boot its disk (BIOS, E1000) and check
        if: ${{ env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'ova') }}
        timeout-minutes: 50
        run: |
          python3 packaging/os/formats/vm.py check-ova "$OUT"/redgiant-os-*-x86_64.ova
          mkdir -p "$RUNNER_TEMP/ova"
          tar -xf "$OUT"/redgiant-os-*-x86_64.ova -C "$RUNNER_TEMP/ova"
          python3 -c "import sys, xml.dom.minidom as m; m.parse(sys.argv[1])" "$RUNNER_TEMP"/ova/*.ovf
          qemu-img info "$RUNNER_TEMP"/ova/*.vmdk
          packaging/os/test/boot-test.sh boot --arch amd64 --firmware bios --nic e1000 --disk "$RUNNER_TEMP"/ova/*.vmdk --logs logs/ova --timeout 2400
          rm -rf "$RUNNER_TEMP/ova"
      - name: Sizes and sha256
        if: ${{ always() && env.SKIP != '1' }}
        run: |
          cd "$OUT"
          rm -f ./*.size redgiant-os-stack.json
          ls redgiant-os-* >/dev/null 2>&1 || exit 0
          sha256sum redgiant-os-* | tee SHA256SUMS-${{ matrix.arch }}
          ls -la
      # Also when a boot fails: the images can then be looked at.
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.SKIP != '1' }}
        with:
          name: redgiant-os-${{ matrix.arch }}
          path: |
            /mnt/os/*
            !/mnt/os/work-*
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.SKIP != '1' }}
        with:
          name: redgiant-os-${{ matrix.arch }}-logs
          path: logs/**/serial-*.log
          retention-days: 7

  # The container template (G39.2): Proxmox, LXC, Incus. Started in Incus here (LXC, unprivileged,
  # nesting), as Proxmox runs it; the Proxmox helper script is checked by shellcheck here and by its
  # tests (packaging/os/test/proxmox.test.ts) in CI.
  lxc:
    needs: stack
    if: ${{ !inputs.only || contains(inputs.only, 'lxc') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OUT: /mnt/os
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts (shellcheck)
        run: |
          shellcheck --version | head -2
          shellcheck -x packaging/os/proxmox/redgiant-proxmox.sh packaging/os/lxc/lxc.sh packaging/os/raspi/raspi.sh \
            packaging/os/test/lxc-test.sh packaging/os/test/boot-test.sh
          bash packaging/os/proxmox/redgiant-proxmox.sh --help | head -5
      - uses: actions/download-artifact@v4
        with:
          name: redgiant-os-stack
          path: stack
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p "$OUT" && sudo chown "$(id -u):$(id -g)" "$OUT"
          df -h / "$OUT"
      - name: Build the template
        timeout-minutes: 90
        run: |
          docker build -q -f packaging/os/builder.Dockerfile -t redgiant-os-builder packaging/os
          cp stack/redgiant-os-stack.json "$OUT/"
          docker run --rm --privileged -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/src" -v "$OUT:/out" redgiant-os-builder \
            /src/packaging/os/build.sh --arch amd64 --board lxc --stack /out/redgiant-os-stack.json --out /out
          sudo rm -rf "$OUT"/work-*
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          ls -la "$OUT"
      - name: Incus
        timeout-minutes: 10
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends incus dnsmasq-base
          sudo incus admin init --minimal
          # Docker's firewall drops forwarded traffic; the container's bridge is let through.
          sudo iptables -I DOCKER-USER -i incusbr0 -j ACCEPT || true
          sudo iptables -I DOCKER-USER -o incusbr0 -j ACCEPT || true
          sudo incus version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The update of the system's files on a real system: this commit's files, signed with a
      # key made here for the test (the release's key never leaves its secret).
      - name: The system's files, signed with a throwaway key
        run: |
          f="$RUNNER_TEMP/files"
          node packaging/os/files.mjs --version "${{ needs.stack.outputs.version }}" --out "$f"
          openssl genrsa -out "$RUNNER_TEMP/throwaway.pem" 2048 2>/dev/null
          openssl rsa -in "$RUNNER_TEMP/throwaway.pem" -pubout -out "$f/key.pem" 2>/dev/null
          openssl dgst -sha256 -sign "$RUNNER_TEMP/throwaway.pem" "$f/redgiant-os-files.json" | base64 -w0 >"$f/redgiant-os-files.json.sig"
          rm -f "$RUNNER_TEMP/throwaway.pem"
          ls -la "$f"
      - name: Start the template in Incus and check
        timeout-minutes: 50
        run: sudo packaging/os/test/lxc-test.sh --template "$OUT"/redgiant-os-*-x86_64-lxc.tar.zst --files "$RUNNER_TEMP/files" --logs logs/lxc --timeout 1500
      - name: sha256
        if: ${{ always() }}
        run: |
          cd "$OUT"
          rm -f redgiant-os-stack.json
          ls redgiant-os-* >/dev/null 2>&1 || exit 0
          sha256sum redgiant-os-* | tee SHA256SUMS-amd64-lxc
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: redgiant-os-amd64-lxc
          path: |
            /mnt/os/*
            !/mnt/os/work-*
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: redgiant-os-amd64-lxc-logs
          path: logs/lxc/*.log
          retention-days: 7

  # Raspberry Pi 4 (G39.2): no Pi here, so the image's layout and files are checked (build.sh does it
  # as it writes them, and here again from the file), then its system is started on QEMU's virt
  # machine with the image's own kernel and initramfs (emulated: slow) and checked like the others.
  raspi:
    needs: stack
    if: ${{ !inputs.only || contains(inputs.only, 'raspi') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      OUT: /mnt/os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: redgiant-os-stack
          path: stack
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p "$OUT" && sudo chown "$(id -u):$(id -g)" "$OUT"
          df -h / "$OUT"
      - name: Build the image
        timeout-minutes: 90
        run: |
          docker build -q -f packaging/os/builder.Dockerfile -t redgiant-os-builder packaging/os
          cp stack/redgiant-os-stack.json "$OUT/"
          docker run --rm --privileged -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/src" -v "$OUT:/out" redgiant-os-builder \
            /src/packaging/os/build.sh --arch arm64 --board raspi --stack /out/redgiant-os-stack.json --out /out
          sudo rm -rf "$OUT"/work-*
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          ls -la "$OUT"
      - name: The image's partitions and boot files
        timeout-minutes: 20
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mtools qemu-system-arm qemu-utils
          img="$RUNNER_TEMP/raspi.img"
          xz -dc "$OUT"/redgiant-os-*-arm64-raspi.img.xz > "$img"
          sfdisk -d "$img" | tee "$RUNNER_TEMP/layout"
          grep -q "label: dos" "$RUNNER_TEMP/layout"
          grep -qE "start= +8192, size= +1048576, type=c, bootable" "$RUNNER_TEMP/layout"
          grep -qE "start= +1056768, .*type=83" "$RUNNER_TEMP/layout"
          [ "$(blkid -p -O $((8192 * 512)) -s LABEL -o value "$img")" = RASPIFIRM ]
          [ "$(blkid -p -O $((1056768 * 512)) -s LABEL -o value "$img")" = RASPIROOT ]
          fat="$img@@$((8192 * 512))"
          mdir -b -i "$fat" ::/ | tee "$RUNNER_TEMP/boot-files"
          for f in config.txt cmdline.txt start4.elf fixup4.dat bcm2711-rpi-4-b.dtb README-RedGiant.txt; do
            grep -qi "/$f\$" "$RUNNER_TEMP/boot-files" || { echo "::error::no $f on the boot partition"; exit 1; }
          done
          mtype -i "$fat" ::/config.txt
          mtype -i "$fat" ::/cmdline.txt
          mtype -i "$fat" ::/config.txt | grep -q "arm_64bit=1"
          mtype -i "$fat" ::/cmdline.txt | grep -q "root=LABEL=RASPIROOT"
          mkdir -p "$RUNNER_TEMP/kernel"
          mcopy -i "$fat" "::/$(grep -io 'vmlinuz-[^ ]*' "$RUNNER_TEMP/boot-files" | head -1)" "$RUNNER_TEMP/kernel/vmlinuz"
          mcopy -i "$fat" "::/$(grep -io 'initrd.img-[^ ]*' "$RUNNER_TEMP/boot-files" | head -1)" "$RUNNER_TEMP/kernel/initrd.img"
          ls -la "$RUNNER_TEMP/kernel"
      - name: Start the image's system on QEMU (arm64 virt, its kernel) and check
        timeout-minutes: 130
        # Emulated: the first start loads RedGiant's images for many minutes before the self-test.
        # No firmware, so no SMBIOS: the self-test's credential comes on the kernel's command line.
        env:
          START_LIMIT: 5400
        run: |
          # A 32 GB card: the system grows into it at start (growroot on an MBR disk).
          truncate -s 32G "$RUNNER_TEMP/raspi.img"
          packaging/os/test/boot-test.sh boot --arch arm64 --firmware direct --disk "$RUNNER_TEMP/raspi.img" \
            --kernel "$RUNNER_TEMP/kernel/vmlinuz" --initrd "$RUNNER_TEMP/kernel/initrd.img" \
            --append "root=LABEL=RASPIROOT rw console=ttyAMA0,115200 net.ifnames=0 rootwait systemd.set_credential=redgiant.selftest:1" \
            --logs logs/raspi --timeout 7200
          rm -f "$RUNNER_TEMP/raspi.img"
      - name: sha256
        if: ${{ always() }}
        run: |
          cd "$OUT"
          rm -f redgiant-os-stack.json
          ls redgiant-os-* >/dev/null 2>&1 || exit 0
          sha256sum redgiant-os-* | tee SHA256SUMS-arm64-raspi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: redgiant-os-arm64-raspi
          path: |
            /mnt/os/*
            !/mnt/os/work-*
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: redgiant-os-arm64-raspi-logs
          path: logs/raspi/serial-*.log
          retention-days: 7

  # A preview by hand (input preview): what this run built, signed like a release, on the
  # pre-release os-preview (never "latest": RedGiant's updates read only the latest release).
  preview:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.preview && needs.stack.result == 'success' && needs.lxc.result == 'success' }}
    needs: [stack, build, lxc, raspi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: redgiant-os-*
          path: dl
      - name: SHA256SUMS-os and the stack, signed with the update key (only the files of jobs that passed)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          BUILD: ${{ needs.build.result }}
          RASPI: ${{ needs.raspi.result }}
        run: |
          mkdir -p rel
          [ "$BUILD" = success ] || rm -rf dl/redgiant-os-amd64 dl/redgiant-os-arm64
          [ "$RASPI" = success ] || rm -rf dl/redgiant-os-arm64-raspi
          find dl -type f \( -name 'redgiant-os-*.qcow2' -o -name 'redgiant-os-*.raw.zst' -o -name 'redgiant-os-*.iso' -o -name 'redgiant-os-*.vhdx.zip' -o -name 'redgiant-os-*.ova' -o -name 'redgiant-os-*-lxc.tar.zst' -o -name 'redgiant-os-*-raspi.img.xz' -o -name redgiant-os-stack.json -o -name redgiant-os-files.json -o -name 'redgiant-os-files-*.tar.zst' \) -exec cp {} rel/ \;
          cp packaging/os/proxmox/redgiant-proxmox.sh rel/
          (cd rel && sha256sum redgiant-os-* redgiant-proxmox.sh > SHA256SUMS-os)
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "UPDATE_SIGNING_KEY is missing: the OS's files must be signed"; exit 1; }
          node packaging/update/sign.mjs rel/SHA256SUMS-os
          [ ! -e rel/redgiant-os-stack.json ] || node packaging/update/sign.mjs rel/redgiant-os-stack.json
          [ ! -e rel/redgiant-os-files.json ] || node packaging/update/sign.mjs rel/redgiant-os-files.json
          cat rel/SHA256SUMS-os
      # The signed files, also as an artifact: the pre-release can be made from them by hand when
      # this repository's token may not create releases.
      - uses: actions/upload-artifact@v4
        with:
          name: redgiant-os-preview
          path: rel/*
          compression-level: 0
          retention-days: 14
      - name: The pre-release os-preview
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.stack.outputs.version }}
        run: |
          notes="RedGiant OS preview (not a release): RedGiant $VERSION, built from ${GITHUB_SHA::12} on ${GITHUB_REF_NAME}. Files listed in SHA256SUMS-os, signed with the update key. Proxmox: bash redgiant-proxmox.sh --lxc --release os-preview (docs/INSTALL-OS.md)."
          if gh release view os-preview >/dev/null 2>&1; then
            gh release edit os-preview --prerelease --latest=false --notes "$notes"
          else
            gh release create os-preview --prerelease --latest=false --target "$GITHUB_SHA" --title "RedGiant OS preview" --notes "$notes"
          fi
          gh release upload os-preview rel/* --clobber
          gh release view os-preview --json assets --jq '.assets[].name'

  # Attached to the tag's release, only when release.yml asks (behind REDGIANT_OS_RELEASE): the
  # images this run built, or (reuse_run, 3.7.4) those of the earlier run release.yml chose. Either
  # way they are checked first: every file the release lists, its sha256 as built, and the stack and
  # the system's files they carry are the release's (reuse.mjs: against the tags just published).
  # With dry_run: checked and signed, nothing attached.
  publish:
    if: ${{ !cancelled() && (inputs.publish || inputs.dry_run) && (startsWith(github.ref, 'refs/tags/') || inputs.dry_run) && needs.plan.result == 'success' && (inputs.reuse_run != '' || (needs.stack.result == 'success' && needs.build.result == 'success' && needs.lxc.result == 'success' && needs.raspi.result == 'success')) }}
    needs: [plan, stack, build, lxc, raspi]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: redgiant-os-*
          path: dl
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Every image, as built and booted, carrying this release's stack and files
        env:
          WANTED: ${{ inputs.version }}
          EXPECT_TAG: ${{ inputs.dry_run && inputs.expect_tag || '' }}
        run: |
          set -euo pipefail
          version="${WANTED#v}"
          ls -la dl/*
          for d in redgiant-os-amd64 redgiant-os-arm64 redgiant-os-amd64-lxc redgiant-os-arm64-raspi; do
            sums=$(find "dl/$d" -maxdepth 1 -name 'SHA256SUMS-*' | head -1)
            [ -n "$sums" ] || { echo "$d: no SHA256SUMS"; exit 1; }
            (cd "dl/$d" && sha256sum -c --strict "$(basename "$sums")")
          done
          for f in "redgiant-os-$version-x86_64.qcow2" "redgiant-os-$version-x86_64.raw.zst" "redgiant-os-$version-x86_64.iso" \
                   "redgiant-os-$version-x86_64.vhdx.zip" "redgiant-os-$version-x86_64.ova" "redgiant-os-$version-arm64.qcow2" \
                   "redgiant-os-$version-arm64.raw.zst" "redgiant-os-$version-x86_64-lxc.tar.zst" "redgiant-os-$version-arm64-raspi.img.xz"; do
            [ -n "$(find dl -type f -name "$f")" ] || { echo "::error::no $f"; exit 1; }
          done
          node packaging/os/reuse.mjs --dir dl/redgiant-os-stack --version "$version" --source-tag "$EXPECT_TAG"
      - name: SHA256SUMS, the stack and the system's files, signed with the update key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p rel
          find dl -type f \( -name 'redgiant-os-*.qcow2' -o -name 'redgiant-os-*.raw.zst' -o -name 'redgiant-os-*.iso' -o -name 'redgiant-os-*.vhdx.zip' -o -name 'redgiant-os-*.ova' -o -name 'redgiant-os-*-lxc.tar.zst' -o -name 'redgiant-os-*-raspi.img.xz' -o -name redgiant-os-stack.json -o -name redgiant-os-files.json -o -name 'redgiant-os-files-*.tar.zst' \) -exec cp {} rel/ \;
          # The Proxmox host's helper script, listed and signed with the images.
          cp packaging/os/proxmox/redgiant-proxmox.sh rel/
          (cd rel && sha256sum redgiant-os-* redgiant-proxmox.sh > SHA256SUMS-os)
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "UPDATE_SIGNING_KEY is missing: the OS's files must be signed"; exit 1; }
          node packaging/update/sign.mjs rel/SHA256SUMS-os
          node packaging/update/sign.mjs rel/redgiant-os-stack.json
          node packaging/update/sign.mjs rel/redgiant-os-files.json
          ls -la rel
          cat rel/SHA256SUMS-os
      - name: Dry run, stopping here
        if: inputs.dry_run
        env:
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: echo "::notice title=Dry run::RedGiant OS images of run ${REUSE_RUN:-$GITHUB_RUN_ID} checked and signed; nothing attached"
      - name: Attach to the release
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" rel/* --clobber
