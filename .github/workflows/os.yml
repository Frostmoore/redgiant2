# RedGiant OS (G39.1, G39.2): builds the images on GitHub's runners (x86_64 and arm64, each on its
# own processor), boots every one in QEMU headless and checks it (packaging/os/test/boot-test.sh).
# Runs by hand, on a version branch when the OS's files change, and from release.yml for a tag
# (publish: the images are attached to the release with SHA256SUMS signed like release.json).
# The release does that only while the repository variable REDGIANT_OS_RELEASE is "true".
name: RedGiant OS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "RedGiant version whose images the OS carries (empty: the latest release)"
        type: string
        default: ""
      arm64:
        description: "Also build and boot the arm64 images (emulated boot: slow)"
        type: boolean
        default: true
      only:
        description: "Only these formats, comma separated (qcow2,raw,iso,vhdx,ova,lxc,raspi); empty: all"
        type: string
        default: ""
      preview:
        description: "Put what this run builds on the pre-release os-preview (signed; never the latest release)"
        type: boolean
        default: false
      quick:
        description: "amd64 only: build the qcow2, boot it (UEFI, HTTPS included), then the Wi-Fi checks"
        type: boolean
        default: false
  push:
    branches: ["p[0-9]*", "a[0-9]*", "b[0-9]*"]
    paths:
      - "packaging/os/**"
      - "packages/server/helpers/**"
      - ".github/workflows/os.yml"
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch replaces a build still running (a tag's run is never cancelled);
# runs by hand for other formats ('only') do not replace each other.
concurrency:
  group: os-${{ github.ref }}-${{ github.event_name }}-${{ inputs.only }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  stack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.version }}
        run: |
          v="${WANTED#v}"
          [ -n "$v" ] || v=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name | sed 's/^v//')
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: The stack, pinned by digest
        run: |
          mkdir -p dist
          node packaging/os/stack.mjs --version "${{ steps.v.outputs.version }}" --out dist/redgiant-os-stack.json
      - uses: actions/upload-artifact@v4
        with:
          name: redgiant-os-stack
          path: dist/redgiant-os-stack.json
          retention-days: 7

  build:
    needs: stack
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            formats: qcow2,raw,iso,vhdx,ova
          - arch: arm64
            runner: ubuntu-24.04-arm
            formats: qcow2,raw
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      OUT: /mnt/os
    steps:
      - name: What to build (arm64 when wanted, the formats asked for, the qcow2 alone when quick)
        env:
          ONLY: ${{ inputs.only }}
          QUICK: ${{ github.event_name == 'workflow_dispatch' && inputs.quick }}
          NO_ARM64: ${{ matrix.arch == 'arm64' && github.event_name == 'workflow_dispatch' && (!inputs.arm64 || inputs.quick) }}
        run: |
          f="${{ matrix.formats }}"
          if [ -n "$ONLY" ]; then f=$(comm -12 <(tr , '\n' <<<"$f" | sort) <(tr , '\n' <<<"$ONLY" | tr -d ' ' | sort) | paste -sd,); fi
          [ "$QUICK" = true ] && f=qcow2 && echo "QUICK=1" >> "$GITHUB_ENV"
          [ "$NO_ARM64" = true ] && f=""
          echo "FORMATS=$f" >> "$GITHUB_ENV"
          [ -n "$f" ] || echo "SKIP=1" >> "$GITHUB_ENV"
          echo "formats: ${f:-none}"
      - uses: actions/checkout@v4
        if: ${{ env.SKIP != '1' }}
      - uses: actions/download-artifact@v4
        if: ${{ env.SKIP != '1' }}
        with:
          name: redgiant-os-stack
          path: stack
      - name: Room on the disk
        if: ${{ env.SKIP != '1' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p "$OUT" && sudo chown "$(id -u):$(id -g)" "$OUT"
          df -h / "$OUT"
      - name: Build (mmdebstrap, systemd-repart)
        if: ${{ env.SKIP != '1' }}
        run: |
          docker build -q -f packaging/os/builder.Dockerfile -t redgiant-os-builder packaging/os
          cp stack/redgiant-os-stack.json "$OUT/"
          docker run --rm --privileged -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/src" -v "$OUT:/out" redgiant-os-builder \
            /src/packaging/os/build.sh --arch ${{ matrix.arch }} --stack /out/redgiant-os-stack.json \
            --out /out --formats "$FORMATS"
          sudo rm -rf "$OUT"/work-*
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          ls -la "$OUT"
      - name: QEMU
        if: ${{ env.SKIP != '1' }}
        run: |
          sudo apt-get update -q
          if [ "${{ matrix.arch }}" = amd64 ]; then
            sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf
          else
            sudo apt-get install -y -q --no-install-recommends qemu-system-arm qemu-utils qemu-efi-aarch64
          fi
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; echo "KVM: yes"; else echo "KVM: no (emulated)"; fi
      - name: Boot the qcow2 (UEFI) and check, HTTPS included
        if: ${{ env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'qcow2') }}
        timeout-minutes: 50
        run: packaging/os/test/boot-test.sh boot --arch amd64 --firmware uefi --disk "$OUT"/redgiant-os-*-x86_64.qcow2 --logs logs --work "$RUNNER_TEMP/uefi" --timeout 2400
      - name: Wi-Fi checks (mac80211_hwsim and hostapd in the machine)
        if: ${{ always() && env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'qcow2') }}
        timeout-minutes: 50
        run: packaging/os/test/boot-test.sh boot --arch amd64 --firmware uefi --wifi --disk "$OUT"/redgiant-os-*-x86_64.qcow2 --logs logs/wifi --work "$RUNNER_TEMP/wifi" --timeout 2400
      - name: Boot the qcow2 (UEFI, Secure Boot) and check
        if: ${{ env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'qcow2') && env.QUICK != '1' }}
        timeout-minutes: 50
        run: packaging/os/test/boot-test.sh boot --arch amd64 --firmware uefi --secureboot --disk "$OUT"/redgiant-os-*-x86_64.qcow2 --logs logs --timeout 2400
      - name: Boot the qcow2 (BIOS) and check
        if: ${{ env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'qcow2') && env.QUICK != '1' }}
        timeout-minutes: 50
        run: packaging/os/test/boot-test.sh boot --arch amd64 --firmware bios --disk "$OUT"/redgiant-os-*-x86_64.qcow2 --logs logs --timeout 2400
      - name: Install from the ISO (BIOS), then boot the installed disk (UEFI) and check
        if: ${{ env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'iso') && env.QUICK != '1' }}
        timeout-minutes: 80
        run: |
          packaging/os/test/boot-test.sh install --firmware bios --iso "$OUT"/redgiant-os-*-x86_64.iso --disk "$RUNNER_TEMP/installed.qcow2" --logs logs --timeout 1800
          packaging/os/test/boot-test.sh boot --arch amd64 --firmware uefi --disk "$RUNNER_TEMP/installed.qcow2" --logs logs --timeout 2400
      - name: Boot the qcow2 (arm64, UEFI) and check
        if: ${{ env.SKIP != '1' && matrix.arch == 'arm64' && contains(env.FORMATS, 'qcow2') }}
        run: packaging/os/test/boot-test.sh boot --arch arm64 --firmware uefi --disk "$OUT"/redgiant-os-*-arm64.qcow2 --logs logs --timeout 7200
        timeout-minutes: 130
      # Hyper-V and VirtualBox/VMware (G39.2): the same disk through their files. The VHDX boots with
      # UEFI, the OVA's VMDK with the BIOS VirtualBox uses and the E1000 card both offer.
      - name: Boot the VHDX (UEFI) and check
        if: ${{ env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'vhdx') }}
        timeout-minutes: 50
        run: |
          mkdir -p "$RUNNER_TEMP/vhdx"
          unzip -q "$OUT"/redgiant-os-*-x86_64.vhdx.zip -d "$RUNNER_TEMP/vhdx"
          qemu-img info "$RUNNER_TEMP"/vhdx/*.vhdx
          packaging/os/test/boot-test.sh boot --arch amd64 --firmware uefi --disk "$RUNNER_TEMP"/vhdx/*.vhdx --logs logs/vhdx --timeout 2400
          rm -rf "$RUNNER_TEMP/vhdx"
      - name: Check the OVA, boot its disk (BIOS, E1000) and check
        if: ${{ env.SKIP != '1' && matrix.arch == 'amd64' && contains(env.FORMATS, 'ova') }}
        timeout-minutes: 50
        run: |
          python3 packaging/os/formats/vm.py check-ova "$OUT"/redgiant-os-*-x86_64.ova
          mkdir -p "$RUNNER_TEMP/ova"
          tar -xf "$OUT"/redgiant-os-*-x86_64.ova -C "$RUNNER_TEMP/ova"
          python3 -c "import sys, xml.dom.minidom as m; m.parse(sys.argv[1])" "$RUNNER_TEMP"/ova/*.ovf
          qemu-img info "$RUNNER_TEMP"/ova/*.vmdk
          packaging/os/test/boot-test.sh boot --arch amd64 --firmware bios --nic e1000 --disk "$RUNNER_TEMP"/ova/*.vmdk --logs logs/ova --timeout 2400
          rm -rf "$RUNNER_TEMP/ova"
      - name: Sizes and sha256
        if: ${{ always() && env.SKIP != '1' }}
        run: |
          cd "$OUT"
          rm -f ./*.size redgiant-os-stack.json
          ls redgiant-os-* >/dev/null 2>&1 || exit 0
          sha256sum redgiant-os-* | tee SHA256SUMS-${{ matrix.arch }}
          ls -la
      # Also when a boot fails: the images can then be looked at.
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.SKIP != '1' }}
        with:
          name: redgiant-os-${{ matrix.arch }}
          path: |
            /mnt/os/*
            !/mnt/os/work-*
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.SKIP != '1' }}
        with:
          name: redgiant-os-${{ matrix.arch }}-logs
          path: logs/**/serial-*.log
          retention-days: 7

  # The container template (G39.2): Proxmox, LXC, Incus. Started in Incus here (LXC, unprivileged,
  # nesting), as Proxmox runs it; the Proxmox helper script is checked by shellcheck here and by its
  # tests (packaging/os/test/proxmox.test.ts) in CI.
  lxc:
    needs: stack
    if: ${{ !inputs.only || contains(inputs.only, 'lxc') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OUT: /mnt/os
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts (shellcheck)
        run: |
          shellcheck --version | head -2
          shellcheck -x packaging/os/proxmox/redgiant-proxmox.sh packaging/os/lxc/lxc.sh packaging/os/raspi/raspi.sh \
            packaging/os/test/lxc-test.sh packaging/os/test/boot-test.sh
          bash packaging/os/proxmox/redgiant-proxmox.sh --help | head -5
      - uses: actions/download-artifact@v4
        with:
          name: redgiant-os-stack
          path: stack
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p "$OUT" && sudo chown "$(id -u):$(id -g)" "$OUT"
          df -h / "$OUT"
      - name: Build the template
        timeout-minutes: 90
        run: |
          docker build -q -f packaging/os/builder.Dockerfile -t redgiant-os-builder packaging/os
          cp stack/redgiant-os-stack.json "$OUT/"
          docker run --rm --privileged -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/src" -v "$OUT:/out" redgiant-os-builder \
            /src/packaging/os/build.sh --arch amd64 --board lxc --stack /out/redgiant-os-stack.json --out /out
          sudo rm -rf "$OUT"/work-*
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          ls -la "$OUT"
      - name: Incus
        timeout-minutes: 10
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends incus dnsmasq-base
          sudo incus admin init --minimal
          # Docker's firewall drops forwarded traffic; the container's bridge is let through.
          sudo iptables -I DOCKER-USER -i incusbr0 -j ACCEPT || true
          sudo iptables -I DOCKER-USER -o incusbr0 -j ACCEPT || true
          sudo incus version
      - name: Start the template in Incus and check
        timeout-minutes: 50
        run: sudo packaging/os/test/lxc-test.sh --template "$OUT"/redgiant-os-*-x86_64-lxc.tar.zst --logs logs/lxc --timeout 1500
      - name: sha256
        if: ${{ always() }}
        run: |
          cd "$OUT"
          rm -f redgiant-os-stack.json
          ls redgiant-os-* >/dev/null 2>&1 || exit 0
          sha256sum redgiant-os-* | tee SHA256SUMS-amd64-lxc
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: redgiant-os-amd64-lxc
          path: |
            /mnt/os/*
            !/mnt/os/work-*
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: redgiant-os-amd64-lxc-logs
          path: logs/lxc/*.log
          retention-days: 7

  # Raspberry Pi 4 (G39.2): no Pi here, so the image's layout and files are checked (build.sh does it
  # as it writes them, and here again from the file), then its system is started on QEMU's virt
  # machine with the image's own kernel and initramfs (emulated: slow) and checked like the others.
  raspi:
    needs: stack
    if: ${{ !inputs.only || contains(inputs.only, 'raspi') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      OUT: /mnt/os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: redgiant-os-stack
          path: stack
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p "$OUT" && sudo chown "$(id -u):$(id -g)" "$OUT"
          df -h / "$OUT"
      - name: Build the image
        timeout-minutes: 90
        run: |
          docker build -q -f packaging/os/builder.Dockerfile -t redgiant-os-builder packaging/os
          cp stack/redgiant-os-stack.json "$OUT/"
          docker run --rm --privileged -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/src" -v "$OUT:/out" redgiant-os-builder \
            /src/packaging/os/build.sh --arch arm64 --board raspi --stack /out/redgiant-os-stack.json --out /out
          sudo rm -rf "$OUT"/work-*
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          ls -la "$OUT"
      - name: The image's partitions and boot files
        timeout-minutes: 20
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mtools qemu-system-arm qemu-utils
          img="$RUNNER_TEMP/raspi.img"
          xz -dc "$OUT"/redgiant-os-*-arm64-raspi.img.xz > "$img"
          sfdisk -d "$img" | tee "$RUNNER_TEMP/layout"
          grep -q "label: dos" "$RUNNER_TEMP/layout"
          grep -qE "start= +8192, size= +1048576, type=c, bootable" "$RUNNER_TEMP/layout"
          grep -qE "start= +1056768, .*type=83" "$RUNNER_TEMP/layout"
          [ "$(blkid -p -O $((8192 * 512)) -s LABEL -o value "$img")" = RASPIFIRM ]
          [ "$(blkid -p -O $((1056768 * 512)) -s LABEL -o value "$img")" = RASPIROOT ]
          fat="$img@@$((8192 * 512))"
          mdir -b -i "$fat" ::/ | tee "$RUNNER_TEMP/boot-files"
          for f in config.txt cmdline.txt start4.elf fixup4.dat bcm2711-rpi-4-b.dtb README-RedGiant.txt; do
            grep -qi "/$f\$" "$RUNNER_TEMP/boot-files" || { echo "::error::no $f on the boot partition"; exit 1; }
          done
          mtype -i "$fat" ::/config.txt
          mtype -i "$fat" ::/cmdline.txt
          mtype -i "$fat" ::/config.txt | grep -q "arm_64bit=1"
          mtype -i "$fat" ::/cmdline.txt | grep -q "root=LABEL=RASPIROOT"
          mkdir -p "$RUNNER_TEMP/kernel"
          mcopy -i "$fat" "::/$(grep -io 'vmlinuz-[^ ]*' "$RUNNER_TEMP/boot-files" | head -1)" "$RUNNER_TEMP/kernel/vmlinuz"
          mcopy -i "$fat" "::/$(grep -io 'initrd.img-[^ ]*' "$RUNNER_TEMP/boot-files" | head -1)" "$RUNNER_TEMP/kernel/initrd.img"
          ls -la "$RUNNER_TEMP/kernel"
      - name: Start the image's system on QEMU (arm64 virt, its kernel) and check
        timeout-minutes: 130
        run: |
          packaging/os/test/boot-test.sh boot --arch arm64 --firmware direct --disk "$RUNNER_TEMP/raspi.img" \
            --kernel "$RUNNER_TEMP/kernel/vmlinuz" --initrd "$RUNNER_TEMP/kernel/initrd.img" \
            --append "root=LABEL=RASPIROOT rw console=ttyAMA0,115200 net.ifnames=0 rootwait" \
            --logs logs/raspi --timeout 7200
          rm -f "$RUNNER_TEMP/raspi.img"
      - name: sha256
        if: ${{ always() }}
        run: |
          cd "$OUT"
          rm -f redgiant-os-stack.json
          ls redgiant-os-* >/dev/null 2>&1 || exit 0
          sha256sum redgiant-os-* | tee SHA256SUMS-arm64-raspi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: redgiant-os-arm64-raspi
          path: |
            /mnt/os/*
            !/mnt/os/work-*
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: redgiant-os-arm64-raspi-logs
          path: logs/raspi/serial-*.log
          retention-days: 7

  # A preview by hand (input preview): what this run built, signed like a release, on the
  # pre-release os-preview (never "latest": RedGiant's updates read only the latest release).
  preview:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.preview && needs.stack.result == 'success' && !contains(needs.*.result, 'failure') }}
    needs: [stack, build, lxc, raspi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: redgiant-os-*
          path: dl
      - name: SHA256SUMS-os and the stack, signed with the update key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p rel
          find dl -type f \( -name 'redgiant-os-*.qcow2' -o -name 'redgiant-os-*.raw.zst' -o -name 'redgiant-os-*.iso' -o -name 'redgiant-os-*.vhdx.zip' -o -name 'redgiant-os-*.ova' -o -name 'redgiant-os-*-lxc.tar.zst' -o -name 'redgiant-os-*-raspi.img.xz' -o -name redgiant-os-stack.json \) -exec cp {} rel/ \;
          cp packaging/os/proxmox/redgiant-proxmox.sh rel/
          (cd rel && sha256sum redgiant-os-* redgiant-proxmox.sh > SHA256SUMS-os)
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "UPDATE_SIGNING_KEY is missing: the OS's files must be signed"; exit 1; }
          node packaging/update/sign.mjs rel/SHA256SUMS-os
          [ ! -e rel/redgiant-os-stack.json ] || node packaging/update/sign.mjs rel/redgiant-os-stack.json
          cat rel/SHA256SUMS-os
      - name: The pre-release os-preview
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.stack.outputs.version }}
        run: |
          notes="RedGiant OS preview (not a release): RedGiant $VERSION, built from ${GITHUB_SHA::12} on ${GITHUB_REF_NAME}. Files listed in SHA256SUMS-os, signed with the update key. Proxmox: bash redgiant-proxmox.sh --lxc --release os-preview (docs/INSTALL-OS.md)."
          if gh release view os-preview >/dev/null 2>&1; then
            gh release edit os-preview --prerelease --latest=false --notes "$notes"
          else
            gh release create os-preview --prerelease --latest=false --target "$GITHUB_SHA" --title "RedGiant OS preview" --notes "$notes"
          fi
          gh release upload os-preview rel/* --clobber
          gh release view os-preview --json assets --jq '.assets[].name'

  # Attached to the tag's release, only when release.yml asks (behind REDGIANT_OS_RELEASE).
  publish:
    if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/') }}
    needs: [stack, build, lxc, raspi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: redgiant-os-*
          path: dl
      - name: SHA256SUMS and the stack, signed with the update key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p rel
          find dl -type f \( -name 'redgiant-os-*.qcow2' -o -name 'redgiant-os-*.raw.zst' -o -name 'redgiant-os-*.iso' -o -name 'redgiant-os-*.vhdx.zip' -o -name 'redgiant-os-*.ova' -o -name 'redgiant-os-*-lxc.tar.zst' -o -name 'redgiant-os-*-raspi.img.xz' -o -name redgiant-os-stack.json \) -exec cp {} rel/ \;
          # The Proxmox host's helper script, listed and signed with the images.
          cp packaging/os/proxmox/redgiant-proxmox.sh rel/
          (cd rel && sha256sum redgiant-os-* redgiant-proxmox.sh > SHA256SUMS-os)
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "UPDATE_SIGNING_KEY is missing: the OS's files must be signed"; exit 1; }
          node packaging/update/sign.mjs rel/SHA256SUMS-os
          node packaging/update/sign.mjs rel/redgiant-os-stack.json
          ls -la rel
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" rel/* --clobber
