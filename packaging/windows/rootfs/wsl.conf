# The RedGiant distribution for Windows (G22): systemd starts Docker, root is the user, Windows'
# PATH stays out (nothing of the host leaks in).
[boot]
systemd=true

[user]
default=root

[interop]
appendWindowsPath=false

[network]
hostname=redgiant

# Windows' disks belong to uid 1000, the "node" user RedGiant runs as in its container: it writes
# the models of the engine on Windows in %LOCALAPPDATA%\RedGiant\engine (G24.3b).
[automount]
options = "metadata,uid=1000,gid=1000,umask=022"
