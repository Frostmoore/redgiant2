# RedGiant OS (G39.1): what the OS adds to the release's compose.yaml.
#   docker compose -f compose.yaml -f /usr/share/redgiant-os/compose.os.yaml …
services:
  redgiant:
    environment:
      REDGIANT_OS: "1"
      # The OS helper (packages/server/src/os-helper.ts): backup disks, SSH.
      REDGIANT_OS_HELPER_SOCKET: /run/redgiant-helper/helper.sock
    volumes:
      # The directory, not the socket: systemd may make the socket again.
      - type: bind
        source: /run/redgiant-helper
        target: /run/redgiant-helper
      # Disks the helper mounts later (backups on an external disk) appear at the same path.
      - type: bind
        source: /var/lib/redgiant/backups
        target: /var/lib/redgiant/backups
        bind:
          propagation: rslave
