# RedGiant OS: Caddy gets the server's certificate and key as credentials (they stay root-only
# in /var/lib/redgiant/tls), made by redgiant-tls before it starts.
[Unit]
After=redgiant-tls.service
Wants=redgiant-tls.service
ConditionPathExists=/var/lib/redgiant/tls/server.crt

[Service]
LoadCredential=server.crt:/var/lib/redgiant/tls/server.crt
LoadCredential=server.key:/var/lib/redgiant/tls/server.key
# Without --environ: nothing of the environment in the journal. No admin endpoint: a new
# certificate means a restart (redgiant-tls does it).
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
ExecReload=
