# RedGiant OS (p3.7.3): no cache for "this name does not exist".
# Some home routers (TIM's, for one) answer NXDOMAIN to the AAAA question for the names added by
# hand to their DNS, while they answer the A question. systemd-resolved then remembers that
# NXDOMAIN and, for a while, hides the A record too: RedGiant's server in Docker (through the stub
# 127.0.0.53) got ENOTFOUND for the person's own services (a Gitea, a NAS) almost every time.
# Positive answers stay cached as usual.
[Resolve]
Cache=no-negative
