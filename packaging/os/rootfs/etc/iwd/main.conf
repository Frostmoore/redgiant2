# RedGiant OS: iwd joins Wi-Fi networks, systemd-networkd gives the addresses (as for the cable).
# Networks are saved by RedGiant (Settings > System > Network, the console's [w], or
# redgiant-wifi.txt on the EFI partition) in /var/lib/iwd, readable by root only.
[General]
EnableNetworkConfiguration=false
AddressRandomization=once

[Network]
NameResolvingService=systemd

[Scan]
DisablePeriodicScan=false
